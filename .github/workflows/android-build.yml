name: Build FFmpeg Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_API: "24"
      FFMPEG_VERSION: "9.0.2"
      BUILD_JOBS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake curl git \
            libtool meson ninja-build pkg-config python3 texinfo \
            yasm nasm xz-utils zlib1g-dev file
            
      - name: Set up Android NDK
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_NDK_LATEST_HOME:-}" || {
            echo "ANDROID_NDK_LATEST_HOME is not set on this runner."
            exit 1
          }

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Set up Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> "$GITHUB_ENV"
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/android-arm64" >> "$GITHUB_ENV"
          echo "DEPS=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"

      - name: Create build directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX" "$DEPS/lib/pkgconfig" "$DEPS/include"

      - name: Build x264
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://code.videolan.org/videolan/x264.git \
            "$RUNNER_TEMP/x264"

          CROSS="$RUNNER_TEMP/aarch64-linux-android-"

          for tool in ar ranlib strip nm; do
            test -x "$TOOLCHAIN/bin/llvm-$tool"
            ln -sf "$TOOLCHAIN/bin/llvm-$tool" "${CROSS}${tool}"
          done

          ln -sf "$(command -v strings)" "${CROSS}strings"

          cat > "${CROSS}gcc" <<EOF
          #!/bin/sh
          exec "$CC" "\$@"
          EOF

          cat > "${CROSS}g++" <<EOF
          #!/bin/sh
          exec "$CXX" "\$@"
          EOF

          chmod +x "${CROSS}gcc" "${CROSS}g++"
          export PATH="$RUNNER_TEMP:$TOOLCHAIN/bin:$PATH"

          cd "$RUNNER_TEMP/x264"

          ./configure \
            --prefix="$DEPS" \
            --host=aarch64-linux \
            --cross-prefix="$CROSS" \
            --sysroot="$SYSROOT" \
            --extra-cflags="-O2 -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl

          make -j"$BUILD_JOBS"
          make install

          test -s "$DEPS/lib/libx264.a"
          test -s "$DEPS/include/x264.h"

      - name: Build x265 8-bit, 10-bit and 12-bit
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch 4.1 \
            https://bitbucket.org/multicoreware/x265_git.git \
            "$RUNNER_TEMP/x265"

          X265_SOURCE="$RUNNER_TEMP/x265/source"
          X265_BUILD="$RUNNER_TEMP/x265-build"
          TARGET="aarch64-linux-android${ANDROID_API}"

          mkdir -p "$X265_BUILD" "$DEPS/lib" \
            "$DEPS/include" "$DEPS/lib/pkgconfig"

          python3 - "$X265_SOURCE/CMakeLists.txt" "$ANDROID_API" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          api = sys.argv[2]
          content = path.read_text()

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)ARGS[ \t]+\$\{ARM_ARGS\}(?P<rest>[^\n]*)$'
          )
          matches = list(pattern.finditer(content))

          if len(matches) != 5:
              raise SystemExit(
                  f"Expected 5 ARM_ARGS lines, found {len(matches)}; "
                  "check the x265 source before continuing."
              )

          def replace(match):
              return (
                  match.group("indent")
                  + f"ARGS --target=aarch64-linux-android{api} "
                  + "${ARM_ARGS}"
                  + match.group("rest")
              )

          path.write_text(pattern.sub(replace, content))
          print(f"Patched {len(matches)} ARM_ARGS lines.")
          PY

          TARGET_COUNT="$(
            grep -F -c -- "--target=${TARGET}" "$X265_SOURCE/CMakeLists.txt"
          )"
          test "$TARGET_COUNT" -eq 5

          build_x265_variant() {
            local variant="$1"
            shift

            echo "=== Configuring x265: $variant ==="

            cmake -S "$X265_SOURCE" -B "$X265_BUILD/$variant" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM="android-${ANDROID_API}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_C_COMPILER_TARGET="$TARGET" \
              -DCMAKE_CXX_COMPILER_TARGET="$TARGET" \
              -DENABLE_SHARED=OFF \
              -DENABLE_CLI=OFF \
              "$@"

            cmake --build "$X265_BUILD/$variant" \
              --parallel "$BUILD_JOBS"
          }

          build_x265_variant 10bit \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=OFF \
            -DEXPORT_C_API=OFF

          build_x265_variant 12bit \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=ON \
            -DEXPORT_C_API=OFF

          build_x265_variant 8bit \
            -DHIGH_BIT_DEPTH=OFF \
            -DMAIN12=OFF \
            -DEXPORT_C_API=ON \
            -DLINKED_10BIT=ON \
            -DLINKED_12BIT=ON \
            -D10BIT_LIBRARY="$X265_BUILD/10bit/libx265.a" \
            -D12BIT_LIBRARY="$X265_BUILD/12bit/libx265.a"

          install -Dm644 \
            "$X265_BUILD/8bit/libx265.a" \
            "$DEPS/lib/libx265.a"

          install -Dm644 \
            "$X265_SOURCE/x265.h" \
            "$DEPS/include/x265.h"

          X265_CONFIG_HEADER="$(
            find "$X265_BUILD/8bit" -type f \
              -name x265_config.h -print -quit
          )"

          if [ -z "$X265_CONFIG_HEADER" ]; then
            echo "ERROR: x265_config.h was not generated in the 8-bit build."
            find "$X265_BUILD" -type f -name x265_config.h -print
            exit 1
          fi

          install -Dm644 \
            "$X265_CONFIG_HEADER" \
            "$DEPS/include/x265_config.h"

          cat > "$DEPS/lib/pkgconfig/x265.pc" <<EOF
          prefix=$DEPS
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: x265
          Description: H.265/HEVC video encoder
          Version: 4.1
          Libs: -L\${libdir} -lx265
          Libs.private: -lc++ -lm -ldl
          Cflags: -I\${includedir}
          EOF

          test -s "$DEPS/lib/libx265.a"
          test -s "$DEPS/include/x265.h"
          test -s "$DEPS/include/x265_config.h"
          test -s "$DEPS/lib/pkgconfig/x265.pc"

          echo "=== Installed x265 files ==="
          ls -lh "$DEPS/lib/libx265.a" \
            "$DEPS/include/x265.h" \
            "$DEPS/include/x265_config.h"

          echo "x265 8-bit, 10-bit and 12-bit build completed."

      - name: Build libvpx for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch v1.15.2 \
            https://chromium.googlesource.com/webm/libvpx \
            "$RUNNER_TEMP/libvpx"

          cd "$RUNNER_TEMP/libvpx"

          export CC="$CC"
          export CXX="$CXX"
          export AR="$AR"
          export AS="$CC"
          export LD="$CXX"
          export STRIP="$STRIP"
          export CROSS=""

          ./configure \
            --prefix="$DEPS" \
            --target=arm64-android-gcc \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --disable-shared \
            --enable-static \
            --enable-pic \
            --enable-vp8 \
            --enable-vp9 \
            --disable-webm-io \
            --disable-libyuv \
            --extra-cflags="--target=aarch64-linux-android${ANDROID_API} --sysroot=${SYSROOT}" \
            --extra-cxxflags="--target=aarch64-linux-android${ANDROID_API} --sysroot=${SYSROOT}"

          make -j"$BUILD_JOBS"
          make install

          test -s "$DEPS/lib/libvpx.a"
          echo "libvpx build completed."


      - name: Build libaom for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          AOM_SOURCE="$RUNNER_TEMP/libaom"
          AOM_BUILD="$RUNNER_TEMP/libaom-build"

          echo "=== Clone libaom ==="
          git clone --depth 1 --branch v3.12.1 \
            https://aomedia.googlesource.com/aom \
            "$AOM_SOURCE"

          echo "=== Configure libaom for Android ARM64 ==="
          cmake \
            -S "$AOM_SOURCE" \
            -B "$AOM_BUILD" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_TARGET="aarch64-linux-android${ANDROID_API}" \
            -DCMAKE_CXX_COMPILER_TARGET="aarch64-linux-android${ANDROID_API}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_TOOLS=OFF \
            -DENABLE_DOCS=OFF \
            -DENABLE_TESTDATA=OFF \
            -DCONFIG_AV1_ENCODER=1 \
            -DCONFIG_AV1_DECODER=1 \
            -DCONFIG_PIC=1 \
            -DCONFIG_RUNTIME_CPU_DETECT=1 \
            -DCONFIG_MULTITHREAD=1 \
            -DAOM_TARGET_CPU=generic

          echo "=== Build libaom ==="
          cmake --build "$AOM_BUILD" \
            --parallel "$BUILD_JOBS"

          echo "=== Install libaom ==="
          cmake --install "$AOM_BUILD"

          echo "=== Verify installed files ==="
          find "$DEPS/lib" "$DEPS/include" \
            -maxdepth 3 -iname '*aom*' -print

          if [ ! -s "$DEPS/lib/libaom.a" ]; then
            echo "ERROR: libaom.a was not installed at the expected path."
            find "$AOM_BUILD" -type f -name 'libaom*.a' -print
            exit 1
          fi

          if [ ! -s "$DEPS/include/aom/aom_encoder.h" ] || \
             [ ! -s "$DEPS/include/aom/aom_decoder.h" ]; then
            echo "ERROR: libaom public headers are missing."
            exit 1
          fi

          echo "=== Verify ARM64 archive objects ==="
          "$TOOLCHAIN/bin/llvm-ar" t "$DEPS/lib/libaom.a" | head -20

          echo "libaom static build completed successfully."
          
      - name: Build audio libraries
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$CC"
          export CXX="$CXX"
          export AR="$AR"
          export RANLIB="$RANLIB"
          export STRIP="$STRIP"
          export CFLAGS="-O2 -fPIC"
          export CXXFLAGS="-O2 -fPIC"
          export CPPFLAGS="-I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          mkdir -p "$DEPS/lib/pkgconfig"

          build_autotools() {
            local name="$1"
            local url="$2"
            local configure_args="$3"
            local src="$RUNNER_TEMP/$name"

            rm -rf "$src"
            mkdir -p "$src"

            curl -fL --retry 3 "$url" \
              -o "$RUNNER_TEMP/$name.tar.gz"

            tar -xzf "$RUNNER_TEMP/$name.tar.gz" \
              --strip-components=1 \
              -C "$src"

            cd "$src"

            ./configure \
              --build="$(./config.guess 2>/dev/null || echo x86_64-pc-linux-gnu)" \
              --host=aarch64-linux-android \
              --prefix="$DEPS" \
              --enable-static \
              --disable-shared \
              $configure_args

            make -j"$BUILD_JOBS"
            make install
          }

          echo "=== Building Opus ==="

          build_autotools opus \
            https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz \
            "--disable-doc --disable-extra-programs"

          test -s "$DEPS/lib/libopus.a"

          echo "=== Building Ogg ==="

          build_autotools libogg \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz \
            "--disable-examples --disable-oggtest"

          test -s "$DEPS/lib/libogg.a"

          echo "=== Building Vorbis ==="

          build_autotools libvorbis \
            https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz \
            "--disable-examples --disable-oggtest"

          test -s "$DEPS/lib/libvorbis.a"
          test -s "$DEPS/lib/libvorbisenc.a"

          echo "=== Building LAME ==="

          build_autotools lame \
            https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz \
            "--disable-frontend"

          test -s "$DEPS/lib/libmp3lame.a"

          # Some LAME builds install libmp3lame.pc instead of lame.pc,
          # or do not install a pkg-config file at all.
          # FFmpeg's --enable-libmp3lame checks for the package named "lame".
          if ! pkg-config --exists lame; then
            echo "Creating fallback lame.pc"

            cat > "$DEPS/lib/pkgconfig/lame.pc" <<EOF
          prefix=$DEPS
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: lame
          Description: LAME MP3 encoder
          Version: 3.100
          Libs: -L\${libdir} -lmp3lame
          Libs.private: -lm
          Cflags: -I\${includedir}
          EOF
          fi

          echo "=== Verifying LAME pkg-config metadata ==="

          test -s "$DEPS/lib/pkgconfig/lame.pc"
          pkg-config --modversion lame
          pkg-config --cflags lame
          pkg-config --static --libs lame

          echo "=== Building TwoLAME ==="

          build_autotools twolame \
            https://downloads.sourceforge.net/project/twolame/twolame/0.4.0/twolame-0.4.0.tar.gz \
            "--disable-frontend"

          test -s "$DEPS/lib/libtwolame.a"

          echo "=== Building Speex ==="

          build_autotools speex \
            https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz \
            "--disable-binaries --disable-examples"

          test -s "$DEPS/lib/libspeex.a"

          echo "=== Building SoXR ==="

          rm -rf "$RUNNER_TEMP/soxr" "$RUNNER_TEMP/soxr-build"

          git clone --depth 1 --branch 0.1.3 \
            https://github.com/chirlu/soxr.git \
            "$RUNNER_TEMP/soxr"

          cmake \
            -S "$RUNNER_TEMP/soxr" \
            -B "$RUNNER_TEMP/soxr-build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_OPENMP=OFF \
            -DBUILD_TESTS=OFF

          cmake --build "$RUNNER_TEMP/soxr-build" \
            --parallel "$BUILD_JOBS"

          cmake --install "$RUNNER_TEMP/soxr-build"

          echo "=== Installed audio libraries ==="

          find "$DEPS/lib" -maxdepth 2 \
            \( -name '*.a' -o -name '*.pc' \) \
            -print | sort

          echo "=== Verifying required static libraries ==="

          for lib in \
            libopus.a \
            libogg.a \
            libvorbis.a \
            libvorbisenc.a \
            libmp3lame.a \
            libtwolame.a \
            libspeex.a \
            libsoxr.a; do

            if [ ! -s "$DEPS/lib/$lib" ]; then
              echo "ERROR: Missing expected library: $DEPS/lib/$lib"
              exit 1
            fi

            echo "OK: $lib"
          done

          echo "=== Verifying pkg-config packages ==="

          for lib in \
            opus \
            vorbis \
            vorbisenc \
            lame \
            twolame \
            speex \
            soxr; do

            if ! pkg-config --exists "$lib"; then
              echo "ERROR: pkg-config cannot find: $lib"
              echo "Available .pc files:"
              find "$DEPS/lib/pkgconfig" -maxdepth 1 \
                -name '*.pc' -print | sort
              exit 1
            fi

            echo "$lib: $(pkg-config --modversion "$lib")"
          done

          echo "All audio libraries built and verified successfully."

      - name: Build dav1d
        shell: bash
        run: |
          set -euo pipefail

          DAV1D_VERSION="1.5.1"
          SRC="$RUNNER_TEMP/dav1d"
          BUILD="$RUNNER_TEMP/dav1d-build"
          CROSS_FILE="$RUNNER_TEMP/dav1d-cross.ini"

          git clone --depth 1 --branch "$DAV1D_VERSION" \
            https://code.videolan.org/videolan/dav1d.git "$SRC"

          cat > "$CROSS_FILE" <<EOF
          [binaries]
          c = '$CC'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = '$(command -v pkg-config)'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-fPIC']
          EOF

          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          meson setup "$BUILD" "$SRC" \
            --cross-file "$CROSS_FILE" \
            --prefix "$DEPS" \
            --libdir lib \
            --buildtype release \
            --default-library static \
            -Denable_tools=false \
            -Denable_tests=false

          ninja -C "$BUILD" -j"$BUILD_JOBS"
          ninja -C "$BUILD" install

          echo "=== Verify dav1d ==="
          test -s "$DEPS/lib/libdav1d.a"
          test -s "$DEPS/lib/pkgconfig/dav1d.pc"
          echo "dav1d built and installed successfully"
          
      - name: Build SVT-AV1
        shell: bash
        run: |
          set -euo pipefail

          SVT_VERSION="v2.3.0"
          SRC="$RUNNER_TEMP/SVT-AV1"
          BUILD="$RUNNER_TEMP/svt-av1-build"

          git clone --depth 1 --branch "$SVT_VERSION" \
            https://gitlab.com/AOMediaCodec/SVT-AV1.git "$SRC"

          cmake -S "$SRC" -B "$BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF

          cmake --build "$BUILD" --parallel "$BUILD_JOBS"
          cmake --install "$BUILD"

          echo "=== Verify SVT-AV1 ==="
          find "$DEPS/lib" -maxdepth 2 \
            \( -iname '*svt*av1*.a' -o -iname '*svt*av1*.pc' \) \
            -print

          test -s "$DEPS/lib/libSvtAv1Enc.a"
          test -s "$DEPS/lib/pkgconfig/SvtAv1Enc.pc"

          echo "SVT-AV1 built and installed successfully"
          
      - name: Build FreeType
        shell: bash
        run: |
          set -euo pipefail

          FREETYPE_VERSION="VER-2-13-3"
          SRC="$RUNNER_TEMP/freetype"
          BUILD="$RUNNER_TEMP/freetype-build"

          git clone --depth 1 --branch "$FREETYPE_VERSION" \
            https://github.com/freetype/freetype.git "$SRC"

          cmake -S "$SRC" -B "$BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE

          cmake --build "$BUILD" --parallel "$BUILD_JOBS"
          cmake --install "$BUILD"

          echo "=== Verify FreeType ==="
          test -s "$DEPS/lib/libfreetype.a"
          test -s "$DEPS/lib/pkgconfig/freetype2.pc"
          echo "FreeType built and installed successfully"


      - name: Build FriBidi
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v1.0.16"
          SRC="$RUNNER_TEMP/fribidi"
          BUILD="$RUNNER_TEMP/fribidi-build"

          git clone --depth 1 --branch "$VERSION" \
            https://github.com/fribidi/fribidi.git "$SRC"

          meson setup "$BUILD" "$SRC" \
            --cross-file "$RUNNER_TEMP/dav1d-cross.ini" \
            --prefix "$DEPS" \
            --libdir lib \
            --buildtype release \
            --default-library static \
            -Ddocs=false \
            -Dtests=false \
            -Dbin=false

          ninja -C "$BUILD" -j"$BUILD_JOBS"
          ninja -C "$BUILD" install

          test -s "$DEPS/lib/libfribidi.a"
          test -s "$DEPS/lib/pkgconfig/fribidi.pc"
          echo "FriBidi built successfully"

      - name: Build HarfBuzz
        shell: bash
        run: |
          set -euo pipefail

          VERSION="10.2.0"
          SRC="$RUNNER_TEMP/harfbuzz"
          BUILD="$RUNNER_TEMP/harfbuzz-build"

          # Make Android dependency metadata visible in this step.
          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

