name: Build FFmpeg Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_API: "24"
      FFMPEG_VERSION: "9.0.2"
      BUILD_JOBS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake curl git \
            libtool ninja-build pkg-config python3 texinfo \
            yasm nasm xz-utils zlib1g-dev file

      - name: Set up Android NDK
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_NDK_LATEST_HOME:-}" || {
            echo "ANDROID_NDK_LATEST_HOME is not set on this runner."
            exit 1
          }

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Set up Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> "$GITHUB_ENV"
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/android-arm64" >> "$GITHUB_ENV"
          echo "DEPS=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"

      - name: Create build directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX" "$DEPS/lib/pkgconfig" "$DEPS/include"

      - name: Build x264
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://code.videolan.org/videolan/x264.git \
            "$RUNNER_TEMP/x264"

          CROSS="$RUNNER_TEMP/aarch64-linux-android-"

          for tool in ar ranlib strip nm; do
            test -x "$TOOLCHAIN/bin/llvm-$tool"
            ln -sf "$TOOLCHAIN/bin/llvm-$tool" "${CROSS}${tool}"
          done

          ln -sf "$(command -v strings)" "${CROSS}strings"

          cat > "${CROSS}gcc" <<EOF
          #!/bin/sh
          exec "$CC" "\$@"
          EOF

          cat > "${CROSS}g++" <<EOF
          #!/bin/sh
          exec "$CXX" "\$@"
          EOF

          chmod +x "${CROSS}gcc" "${CROSS}g++"
          export PATH="$RUNNER_TEMP:$TOOLCHAIN/bin:$PATH"

          cd "$RUNNER_TEMP/x264"

          ./configure \
            --prefix="$DEPS" \
            --host=aarch64-linux \
            --cross-prefix="$CROSS" \
            --sysroot="$SYSROOT" \
            --extra-cflags="-O2 -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl

          make -j"$BUILD_JOBS"
          make install

          test -s "$DEPS/lib/libx264.a"
          test -s "$DEPS/include/x264.h"

      - name: Build x265 8-bit, 10-bit and 12-bit
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch 4.1 \
            https://bitbucket.org/multicoreware/x265_git.git \
            "$RUNNER_TEMP/x265"

          X265_SOURCE="$RUNNER_TEMP/x265/source"
          X265_BUILD="$RUNNER_TEMP/x265-build"
          TARGET="aarch64-linux-android${ANDROID_API}"

          mkdir -p "$X265_BUILD" "$DEPS/lib" \
            "$DEPS/include" "$DEPS/lib/pkgconfig"

          python3 - "$X265_SOURCE/CMakeLists.txt" "$ANDROID_API" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          api = sys.argv[2]
          content = path.read_text()

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)ARGS[ \t]+\$\{ARM_ARGS\}(?P<rest>[^\n]*)$'
          )
          matches = list(pattern.finditer(content))

          if len(matches) != 5:
              raise SystemExit(
                  f"Expected 5 ARM_ARGS lines, found {len(matches)}; "
                  "check the x265 source before continuing."
              )

          def replace(match):
              return (
                  match.group("indent")
                  + f"ARGS --target=aarch64-linux-android{api} "
                  + "${ARM_ARGS}"
                  + match.group("rest")
              )

          path.write_text(pattern.sub(replace, content))
          print(f"Patched {len(matches)} ARM_ARGS lines.")
          PY

          TARGET_COUNT="$(
            grep -F -c -- "--target=${TARGET}" "$X265_SOURCE/CMakeLists.txt"
          )"
          test "$TARGET_COUNT" -eq 5

          build_x265_variant() {
            local variant="$1"
            shift

            echo "=== Configuring x265: $variant ==="

            cmake -S "$X265_SOURCE" -B "$X265_BUILD/$variant" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM="android-${ANDROID_API}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_C_COMPILER_TARGET="$TARGET" \
              -DCMAKE_CXX_COMPILER_TARGET="$TARGET" \
              -DENABLE_SHARED=OFF \
              -DENABLE_CLI=OFF \
              "$@"

            cmake --build "$X265_BUILD/$variant" \
              --parallel "$BUILD_JOBS"
          }

          build_x265_variant 10bit \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=OFF \
            -DEXPORT_C_API=OFF

          build_x265_variant 12bit \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=ON \
            -DEXPORT_C_API=OFF

          build_x265_variant 8bit \
            -DHIGH_BIT_DEPTH=OFF \
            -DMAIN12=OFF \
            -DEXPORT_C_API=ON \
            -DLINKED_10BIT=ON \
            -DLINKED_12BIT=ON \
            -D10BIT_LIBRARY="$X265_BUILD/10bit/libx265.a" \
            -D12BIT_LIBRARY="$X265_BUILD/12bit/libx265.a"

          install -Dm644 \
            "$X265_BUILD/8bit/libx265.a" \
            "$DEPS/lib/libx265.a"

          install -Dm644 \
            "$X265_SOURCE/x265.h" \
            "$DEPS/include/x265.h"

          X265_CONFIG_HEADER="$(
            find "$X265_BUILD/8bit" -type f \
              -name x265_config.h -print -quit
          )"

          if [ -z "$X265_CONFIG_HEADER" ]; then
            echo "ERROR: x265_config.h was not generated in the 8-bit build."
            find "$X265_BUILD" -type f -name x265_config.h -print
            exit 1
          fi

          install -Dm644 \
            "$X265_CONFIG_HEADER" \
            "$DEPS/include/x265_config.h"

          cat > "$DEPS/lib/pkgconfig/x265.pc" <<EOF
          prefix=$DEPS
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: x265
          Description: H.265/HEVC video encoder
          Version: 4.1
          Libs: -L\${libdir} -lx265
          Libs.private: -lc++ -lm -ldl
          Cflags: -I\${includedir}
          EOF

          test -s "$DEPS/lib/libx265.a"
          test -s "$DEPS/include/x265.h"
          test -s "$DEPS/include/x265_config.h"
          test -s "$DEPS/lib/pkgconfig/x265.pc"

          echo "=== Installed x265 files ==="
          ls -lh "$DEPS/lib/libx265.a" \
            "$DEPS/include/x265.h" \
            "$DEPS/include/x265_config.h"

          echo "x265 8-bit, 10-bit and 12-bit build completed."

      - name: Build libvpx for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch v1.15.2 \
            https://chromium.googlesource.com/webm/libvpx \
            "$RUNNER_TEMP/libvpx"

          cd "$RUNNER_TEMP/libvpx"

          export CC="$CC"
          export CXX="$CXX"
          export AR="$AR"
          export AS="$CC"
          export LD="$CXX"
          export STRIP="$STRIP"
          export CROSS=""

          ./configure \
            --prefix="$DEPS" \
            --target=arm64-android-gcc \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --disable-shared \
            --enable-static \
            --enable-pic \
            --enable-vp8 \
            --enable-vp9 \
            --disable-webm-io \
            --disable-libyuv \
            --extra-cflags="--target=aarch64-linux-android${ANDROID_API} --sysroot=${SYSROOT}" \
            --extra-cxxflags="--target=aarch64-linux-android${ANDROID_API} --sysroot=${SYSROOT}"

          make -j"$BUILD_JOBS"
          make install

          test -s "$DEPS/lib/libvpx.a"
          echo "libvpx build completed."

      - name: Build audio libraries
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$CC"
          export CXX="$CXX"
          export AR="$AR"
          export RANLIB="$RANLIB"
          export STRIP="$STRIP"
          export CFLAGS="-O2 -fPIC"
          export CXXFLAGS="-O2 -fPIC"
          export CPPFLAGS="-I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          build_autotools() {
            local name="$1"
            local url="$2"
            local configure_args="$3"
            local src="$RUNNER_TEMP/$name"

            rm -rf "$src"
            mkdir -p "$src"

            curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/$name.tar.gz"
            tar -xzf "$RUNNER_TEMP/$name.tar.gz" \
              --strip-components=1 -C "$src"

            cd "$src"

            ./configure \
              --build="$(./config.guess 2>/dev/null || echo x86_64-pc-linux-gnu)" \
              --host=aarch64-linux-android \
              --prefix="$DEPS" \
              --enable-static \
              --disable-shared \
              $configure_args

            make -j"$BUILD_JOBS"
            make install
          }

          build_autotools opus \
            https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz \
            "--disable-doc --disable-extra-programs"

          build_autotools libogg \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz \
            "--disable-examples --disable-oggtest"

          build_autotools libvorbis \
            https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz \
            "--disable-examples --disable-oggtest"

          build_autotools lame \
            https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz \
            "--disable-frontend"

          build_autotools twolame \
            https://downloads.sourceforge.net/project/twolame/twolame/0.4.0/twolame-0.4.0.tar.gz \
            "--disable-frontend"

          build_autotools speex \
            https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz \
            "--disable-binaries --disable-examples"

          git clone --depth 1 --branch 0.1.3 \
            https://github.com/chirlu/soxr.git \
            "$RUNNER_TEMP/soxr"

          cmake -S "$RUNNER_TEMP/soxr" -B "$RUNNER_TEMP/soxr-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_OPENMP=OFF \
            -DBUILD_TESTS=OFF

          cmake --build "$RUNNER_TEMP/soxr-build" --parallel "$BUILD_JOBS"
          cmake --install "$RUNNER_TEMP/soxr-build"

          echo "=== Installed audio libraries ==="
          find "$DEPS/lib" -maxdepth 2 \
            \( -name '*.a' -o -name '*.pc' \) -print | sort

          for lib in \
            libopus.a libogg.a libvorbis.a libvorbisenc.a \
            libmp3lame.a libtwolame.a libspeex.a libsoxr.a; do
            test -s "$DEPS/lib/$lib" || {
              echo "Missing expected library: $DEPS/lib/$lib"
              exit 1
            }
          done

      - name: Configure FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          echo "=== pkg-config library checks ==="
          for lib in x264 x265 vpx opus vorbis vorbisenc \
            lame twolame speex soxr; do
            if ! pkg-config --exists "$lib"; then
              echo "pkg-config cannot find: $lib"
              exit 1
            fi
            echo "$lib: $(pkg-config --modversion "$lib")"
          done

          echo "=== x265 metadata ==="
          cat "$DEPS/lib/pkgconfig/x265.pc"
          pkg-config --cflags x265
          pkg-config --static --libs x265

          echo "=== x265 static C++ link test ==="
          cat > "$RUNNER_TEMP/x265_test.cpp" <<'EOF'
          #include <x265.h>
          int main() {
              return x265_api_get(0) == nullptr;
          }
          EOF

          "$CXX" \
            -I"$DEPS/include" \
            "$RUNNER_TEMP/x265_test.cpp" \
            -L"$DEPS/lib" \
            -Wl,--start-group -lx265 -Wl,--end-group \
            -lc++ -lm -ldl -llog -landroid \
            -o "$RUNNER_TEMP/x265_test"

          echo "x265 static link test passed."

          git clone --depth 1 --branch "n${FFMPEG_VERSION}" \
            https://git.ffmpeg.org/ffmpeg.git \
            "$RUNNER_TEMP/ffmpeg"

          cd "$RUNNER_TEMP/ffmpeg"

          export CFLAGS="-O2 -fPIC -I$DEPS/include"
          export CXXFLAGS="-O2 -fPIC -I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"
          export LIBS="-lc++ -lm -ldl"

          ./configure \
            --prefix="$PREFIX" \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --sysroot="$SYSROOT" \
            --cc="$CC" \
            --cxx="$CXX" \
            --ar="$AR" \
            --ranlib="$RANLIB" \
            --strip="$STRIP" \
            --pkg-config=pkg-config \
            --pkg-config-flags="--static" \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libmp3lame \
            --enable-libtwolame \
            --enable-libspeex \
            --enable-libsoxr \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --extra-cflags="-I$DEPS/include -O2 -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --extra-libs="-lc++ -lm -ldl"

          echo "=== FFmpeg external-library configuration ==="
          grep -E \
            'CONFIG_(LIBX264|LIBX265|LIBVPX|LIBOPUS|LIBVORBIS|LIBMP3LAME|LIBTWOLAME|LIBSPEEX|LIBSOXR)=' \
            config.h || true

      - name: Build FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/ffmpeg"
          make -j"$BUILD_JOBS"
          make install

          test -x "$PREFIX/bin/ffmpeg"
          "$PREFIX/bin/ffmpeg" -version

      - name: Verify FFmpeg configuration and encoders
        shell: bash
        run: |
          set -euo pipefail

          FFMPEG="$PREFIX/bin/ffmpeg"

          echo "=== External-library configuration ==="
          grep -E \
            'CONFIG_(LIBX264|LIBX265|LIBVPX|LIBOPUS|LIBVORBIS|LIBMP3LAME|LIBTWOLAME|LIBSPEEX|LIBSOXR)=' \
            "$RUNNER_TEMP/ffmpeg/config.h" || true

          echo "=== Required encoders ==="
          "$FFMPEG" -hide_banner -encoders

          for encoder in \
            libx264 libx265 libvpx_vp8 libvpx_vp9 \
            libopus libvorbis libmp3lame libtwolame; do
            echo "Checking encoder: $encoder"
            "$FFMPEG" -hide_banner -h "encoder=$encoder" >/dev/null
          done

          echo "Checking Speex decoder"
          "$FFMPEG" -hide_banner -h decoder=speex >/dev/null

          echo "=== ELF architecture ==="
          file "$FFMPEG"

          echo "=== Dynamic dependencies ==="
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" || true

      - name: Package Android ARM64 build
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$RUNNER_TEMP/package"
          FFMPEG="$PREFIX/bin/ffmpeg"

          mkdir -p "$PACKAGE/bin" "$PACKAGE/lib"
          install -m 755 "$FFMPEG" "$PACKAGE/bin/ffmpeg"

          NEEDED="$RUNNER_TEMP/ffmpeg-needed.txt"
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" \
            | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' \
            > "$NEEDED"

          while IFS= read -r lib; do
            [ -n "$lib" ] || continue

            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so)
                continue
                ;;
              libc++_shared.so)
                source_lib="$(
                  find "$NDK" -name libc++_shared.so -type f -print -quit
                )"
                if [ -n "$source_lib" ]; then
                  cp "$source_lib" "$PACKAGE/lib/"
                else
                  echo "Could not locate libc++_shared.so in the NDK."
                  exit 1
                fi
                ;;
              *)
                source_lib="$(
                  find "$DEPS/lib" "$SYSROOT/usr/lib/aarch64-linux-android" \
                    -name "$lib" -type f -print -quit
                )"
                if [ -n "$source_lib" ]; then
                  cp "$source_lib" "$PACKAGE/lib/"
                else
                  echo "Warning: dependency not bundled: $lib"
                fi
                ;;
            esac
          done < "$NEEDED"

          cat > "$PACKAGE/run-ffmpeg.sh" <<'EOF'
          #!/system/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/bin/ffmpeg" "$@"
          EOF

          chmod +x "$PACKAGE/run-ffmpeg.sh"

          cat > "$PACKAGE/README.txt" <<EOF
          FFmpeg ${FFMPEG_VERSION} Android ARM64

          Architecture: ARM64 / aarch64
          Minimum Android API: ${ANDROID_API}

          Run in Termux:
            chmod +x run-ffmpeg.sh
            ./run-ffmpeg.sh -version
            ./run-ffmpeg.sh -encoders

          The binary is located at:
            bin/ffmpeg
          EOF

          cd "$RUNNER_TEMP"
          tar -czf ffmpeg-android-arm64.tar.gz package

          sha256sum ffmpeg-android-arm64.tar.gz \
            > ffmpeg-android-arm64.tar.gz.sha256

          ls -lh \
            "$RUNNER_TEMP/ffmpeg-android-arm64.tar.gz" \
            "$RUNNER_TEMP/ffmpeg-android-arm64.tar.gz.sha256"

      - name: Upload Android ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: |
            ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz
            ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
