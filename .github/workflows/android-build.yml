      - name: Build Theora
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.1.1"
          SRC="$RUNNER_TEMP/libtheora-src"
          ARCHIVE="$RUNNER_TEMP/libtheora-${VERSION}.tar.bz2"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          # Theora requires Ogg.
          test -s "$DEPS/lib/libogg.a"
          test -s "$DEPS/lib/pkgconfig/ogg.pc"

          curl -fL \
            "https://downloads.xiph.org/releases/theora/libtheora-${VERSION}.tar.bz2" \
            -o "$ARCHIVE"

          echo "b6ae1ee2fa3d42ac489287d3ec34c5885730b1296f0801ae577a35193d3affbc  $ARCHIVE" \
            | sha256sum -c -

          rm -rf "$SRC"
          mkdir -p "$SRC"
          tar -xjf "$ARCHIVE" --strip-components=1 -C "$SRC"
          cd "$SRC"

          # Refresh obsolete Autoconf target-triplet helpers.
          # Fetch current GNU config helpers to support Android AArch64.
          curl -fL --retry 3 \
          https://git.savannah.gnu.org/cgit/config.git/plain/config.sub \
            -o ./config.sub

          curl -fL --retry 3 \
          https://git.savannah.gnu.org/cgit/config.git/plain/config.guess \
            -o ./config.guess

          chmod +x ./config.sub ./config.guess
         
# Fail early if the updated helper does not recognize the target.
       ./config.sub aarch64-linux-android
          ./configure \
            --build=x86_64-linux-gnu \
            --host=aarch64-linux-android \
            --prefix="$DEPS" \
            --enable-static \
            --disable-shared \
            --disable-examples \
            --disable-spec \
            --disable-oggtest \
            --disable-vorbistest \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="-O2 -fPIC"

          make -j"$BUILD_JOBS"
          make install

          echo "=== Theora static libraries ==="
          find "$DEPS/lib" -maxdepth 2 -type f -name '*theora*.a' -print

          test -s "$DEPS/lib/libtheoradec.a"
          test -s "$DEPS/lib/libtheoraenc.a"

          echo "=== Theora pkg-config files ==="
          find "$DEPS/lib/pkgconfig" -maxdepth 1 -iname '*theora*.pc' -print

          echo "Theora built successfully"
          
      - name: Build libass
