name: FFmpeg Android ARM64 Executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_API: "24"
      FFMPEG_VERSION: "9.0.2"
      BUILD_JOBS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils make perl cmake ninja-build nasm git pkg-config python3
