      - name: Configure FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          VERSION="n${FFMPEG_VERSION}"
          SRC="$RUNNER_TEMP/ffmpeg"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          echo "=== Verify required pkg-config packages ==="
          for package in \
            x264 x265 vpx aom dav1d SvtAv1Enc \
            freetype2 fribidi harfbuzz fontconfig libass \
            opus vorbis vorbisenc lame twolame speex soxr \
            libopenjp2 lc3 theoradec theoraenc libopenmpt libvmaf; do
            if pkg-config --exists "$package"; then
              printf 'FOUND: %s (%s)\n' \
                "$package" "$(pkg-config --modversion "$package")"
            else
              printf 'NOT FOUND: %s\n' "$package"
            fi
          done

          echo "=== Verify required subtitle dependencies ==="
          for package in freetype2 fribidi harfbuzz fontconfig libass; do
            pkg-config --exists "$package" || {
              echo "Required subtitle dependency missing: $package"
              exit 1
            }
          done

          echo "=== Verify OpenJPEG ==="
          test -s "$DEPS/lib/libopenjp2.a"
          pkg-config --exists libopenjp2

          echo "=== Verify LC3 ==="
          test -s "$DEPS/lib/liblc3.a"
          test -s "$DEPS/lib/pkgconfig/lc3.pc"
          pkg-config --exists lc3

          echo "=== Verify Theora ==="
          test -s "$DEPS/lib/libtheoradec.a"
          test -s "$DEPS/lib/libtheoraenc.a"
          pkg-config --exists theoradec
          pkg-config --exists theoraenc

          echo "=== Verify libass ==="
          test -s "$DEPS/lib/libass.a"

          rm -rf "$SRC"
          git clone --depth 1 --branch "$VERSION" \
            https://git.ffmpeg.org/ffmpeg.git "$SRC"

          cd "$SRC"

          echo "=== Verify VMAF immediately before FFmpeg configure ==="
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          command -v pkg-config
          pkg-config --modversion libvmaf
          pkg-config --exists 'libvmaf >= 2.0.0'
          pkg-config --static --libs libvmaf

          set +e
          ./configure \
            --prefix="$PREFIX" \
            --target-os=android \
            --arch=aarch64 \
            --enable-cross-compile \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --sysroot="$SYSROOT" \
            --cc="$CC" \
            --cxx="$CXX" \
            --ar="$AR" \
            --ranlib="$RANLIB" \
            --strip="$STRIP" \
            --pkg-config=pkg-config \
            --pkg-config-flags=--static \
            --extra-cflags="-I$DEPS/include -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --extra-libs="-lm" \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libaom \
            --enable-libdav1d \
            --enable-libsvtav1 \
            --enable-libfreetype \
            --enable-libfontconfig \
            --enable-libfribidi \
            --enable-libharfbuzz \
            --enable-libass \
            --enable-libwebp \
            --enable-libopenjpeg \
            --enable-liblc3 \
            --enable-libopenmpt \
            --enable-libtheora \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libmp3lame \
            --enable-libtwolame \
            --enable-libspeex \
            --enable-libsoxr \
            --enable-libopencore-amrnb \
            --enable-libopencore-amrwb \
            --enable-libvo-amrwbenc \
            --enable-libgsm \
            --enable-libilbc \
            --enable-libcodec2 \
            --enable-libfdk-aac \
            --enable-libxvid \
            --enable-librtmp \
            --enable-libbluray \
            --enable-librubberband \
            --enable-libvmaf
            configure_status=$?
            set -e

            if [ "$configure_status" -ne 0 ]; then
              echo "=== FFmpeg configure failure: VMAF context ==="
              grep -ni -C 12 'vmaf' ffbuild/config.log || true

              echo "=== Last configure log lines ==="
              tail -n 100 ffbuild/config.log || true

              echo "=== VMAF package metadata ==="
              pkg-config --modversion libvmaf || true
              pkg-config --cflags --libs libvmaf || true
              pkg-config --static --cflags --libs libvmaf || true

              exit "$configure_status"
            fi


          echo "=== Verify selected FFmpeg features ==="
          for feature in \
            LIBX264 LIBX265 LIBVPX LIBAOM LIBDAV1D LIBSVTAV1 \
            LIBFREETYPE LIBFONTCONFIG LIBFRIBIDI LIBHARFBUZZ LIBASS \
            LIBWEBP LIBOPENJPEG LIBLC3 LIBTHEORA LIBOPENMPT \
            LIBOPUS LIBVORBIS LIBMP3LAME LIBTWOLAME LIBSPEEX LIBSOXR \
            LIBCODEC2 LIBFDK_AAC LIBXVID LIBRTMP LIBBLURAY LIBRUBBERBAND LIBVMAF; do
            if grep -q "^#define CONFIG_${feature} 1$" config.h; then
              echo "ENABLED: $feature"
            else
              echo "ERROR: $feature is not enabled"
              exit 1
            fi
          done

          echo "FFmpeg configure completed successfully"
          
      - name: Build FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/ffmpeg"

          echo "=== Building FFmpeg for Android ARM64 ==="
          make -j"$BUILD_JOBS"

          echo "=== Installing FFmpeg ==="
          make install

          FFMPEG="$PREFIX/bin/ffmpeg"

          echo "=== Verifying installed binary ==="
          test -s "$FFMPEG"
          test -x "$FFMPEG"

          echo "=== Binary file information ==="
          file "$FFMPEG"

          echo "=== ELF header ==="
          "$TOOLCHAIN/bin/llvm-readelf" -h "$FFMPEG"

          echo "=== Verifying ARM64 architecture ==="
          "$TOOLCHAIN/bin/llvm-readelf" -h "$FFMPEG" \
            | grep -E 'Machine:.*AArch64'

          echo "=== Verifying Android dynamic dependencies ==="
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" || true

          echo "FFmpeg built and installed successfully."
          echo "The Android ARM64 binary will be tested on Android, not on the Linux runner."

      - name: Verify FFmpeg configuration and encoders
        shell: bash
        run: |
          set -euo pipefail

          FFMPEG="$PREFIX/bin/ffmpeg"

          echo "=== Verify installed FFmpeg binary ==="
          test -s "$FFMPEG"
          test -x "$FFMPEG"
          file "$FFMPEG"

          echo "=== Verify ELF architecture ==="
          "$TOOLCHAIN/bin/llvm-readelf" -h "$FFMPEG" \
            | grep -E 'Class:|Machine:'

          "$TOOLCHAIN/bin/llvm-readelf" -h "$FFMPEG" \
            | grep -qE 'Machine:.*AArch64'

          echo "=== Find FFmpeg configuration files ==="
          find "$RUNNER_TEMP" -maxdepth 6 \
            \( -name config.h -o -name config.mak \) -print

          CONFIG="$RUNNER_TEMP/ffmpeg/config.h"
          CONFIG_MK="$RUNNER_TEMP/ffmpeg/ffbuild/config.mak"

          if [[ ! -s "$CONFIG" || ! -s "$CONFIG_MK" ]]; then
            echo "Checking alternate config.mak location..."
            if [[ -s "$RUNNER_TEMP/ffmpeg/config.mak" ]]; then
              CONFIG_MK="$RUNNER_TEMP/ffmpeg/config.mak"
            fi
          fi

          if [[ ! -s "$CONFIG" ]]; then
            echo "ERROR: config.h not found."
            exit 1
          fi

          if [[ ! -s "$CONFIG_MK" ]]; then
            echo "ERROR: config.mak not found."
            exit 1
          fi

          echo "=== Verify external-library configuration ==="
          for lib in \
            LIBX264 LIBX265 LIBVPX LIBAOM LIBDAV1D LIBSVTAV1 \
            LIBFREETYPE LIBFONTCONFIG LIBFRIBIDI LIBHARFBUZZ LIBASS \
            LIBOPENJPEG LIBLC3 LIBTHEORA \
            LIBWEBP LIBOPUS LIBVORBIS LIBMP3LAME \
            LIBTWOLAME LIBSPEEX LIBSOXR; do

            if grep -qE "^#define CONFIG_${lib} 1$" "$CONFIG"; then
              echo "ENABLED: $lib"
            else
              echo "NOT ENABLED: $lib"
            fi
          done

          echo "=== config.mak library flags ==="
          grep -E \
            '^(CONFIG_LIB(X264|X265|VPX|AOM|DAV1D|SVTAV1|FREETYPE|FONTCONFIG|FRIBIDI|HARFBUZZ|ASS|OPENJPEG|LC3|THEORA|WEBP|OPUS|VORBIS|MP3LAME|TWOLAME|SPEEX|SOXR))=' \
            "$CONFIG_MK" || true

          echo "=== Dynamic dependencies ==="
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" || true

          echo "Verification completed."
          
      - name: Package Android ARM64 build
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$RUNNER_TEMP/package"
          FFMPEG="$PREFIX/bin/ffmpeg"

          mkdir -p "$PACKAGE/bin" "$PACKAGE/lib"
          install -m 755 "$FFMPEG" "$PACKAGE/bin/ffmpeg"

          NEEDED="$RUNNER_TEMP/ffmpeg-needed.txt"
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" \
            | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' \
            > "$NEEDED"

          while IFS= read -r lib; do
            [ -n "$lib" ] || continue

            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so)
                continue
                ;;
              libc++_shared.so)
                source_lib="$(
                  find "$NDK" -name libc++_shared.so -type f -print -quit
                )"
                if [ -n "$source_lib" ]; then
                  cp "$source_lib" "$PACKAGE/lib/"
                else
                  echo "Could not locate libc++_shared.so in the NDK."
                  exit 1
                fi
                ;;
              *)
                source_lib="$(
                  find "$DEPS/lib" "$SYSROOT/usr/lib/aarch64-linux-android" \
                    -name "$lib" -type f -print -quit
                )"
                if [ -n "$source_lib" ]; then
                  cp "$source_lib" "$PACKAGE/lib/"
                else
                  echo "Warning: dependency not bundled: $lib"
                fi
                ;;
            esac
          done < "$NEEDED"

          cat > "$PACKAGE/run-ffmpeg.sh" <<'EOF'
          #!/system/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/bin/ffmpeg" "$@"
          EOF

          chmod +x "$PACKAGE/run-ffmpeg.sh"

          cat > "$PACKAGE/README.txt" <<EOF
          FFmpeg ${FFMPEG_VERSION} Android ARM64

          Architecture: ARM64 / aarch64
          Minimum Android API: ${ANDROID_API}

          Run in Termux:
            chmod +x run-ffmpeg.sh
            ./run-ffmpeg.sh -version
            ./run-ffmpeg.sh -encoders

          The binary is located at:
            bin/ffmpeg
          EOF

          cd "$RUNNER_TEMP"
          tar -czf ffmpeg-android-arm64.tar.gz package

          sha256sum ffmpeg-android-arm64.tar.gz \
            > ffmpeg-android-arm64.tar.gz.sha256

          ls -lh \
            "$RUNNER_TEMP/ffmpeg-android-arm64.tar.gz" \
            "$RUNNER_TEMP/ffmpeg-android-arm64.tar.gz.sha256"

      - name: Upload Android ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: |
            ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz
            ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
