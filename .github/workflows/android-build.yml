name: Build FFmpeg Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_API: "24"
      BUILD_JOBS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake curl git \
            libtool meson ninja-build pkg-config python3 texinfo \
            yasm nasm xz-utils zlib1g-dev file
            
      - name: Set up Android NDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_NDK_LATEST_HOME:-}" || {
            echo "ANDROID_NDK_LATEST_HOME is not set on this runner."
            exit 1
          }
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Set up Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> "$GITHUB_ENV"
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/android-arm64" >> "$GITHUB_ENV"
          echo "DEPS=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"

      - name: Create build directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX" "$DEPS/lib/pkgconfig" "$DEPS/include"

      - name: Build x264
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://code.videolan.org/videolan/x264.git \
            "$RUNNER_TEMP/x264"

          CROSS="$RUNNER_TEMP/aarch64-linux-android-"
          for tool in ar ranlib strip nm; do
            test -x "$TOOLCHAIN/bin/llvm-$tool"
            ln -sf "$TOOLCHAIN/bin/llvm-$tool" "${CROSS}${tool}"
          done
          ln -sf "$(command -v strings)" "${CROSS}strings"

          cat > "${CROSS}gcc" <<EOF
          #!/bin/sh
          exec "$CC" "\$@"
          EOF
          cat > "${CROSS}g++" <<EOF
          #!/bin/sh
          exec "$CXX" "\$@"
          EOF
          chmod +x "${CROSS}gcc" "${CROSS}g++"
          export PATH="$RUNNER_TEMP:$TOOLCHAIN/bin:$PATH"

          cd "$RUNNER_TEMP/x264"
          ./configure \
            --prefix="$DEPS" \
            --host=aarch64-linux \
            --cross-prefix="$CROSS" \
            --sysroot="$SYSROOT" \
            --extra-cflags="-O2 -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl

          make -j"$BUILD_JOBS"
          make install

      - name: Build x265 (8-bit, 10-bit and 12-bit)
        shell: bash
        run: |
          set -euo pipefail

          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          X265_VERSION=$(get_latest_tag "https://bitbucket.org/multicoreware/x265_git.git")
          echo "Latest x265 version: $X265_VERSION"

          git clone --depth 1 --branch "$X265_VERSION" \
            https://bitbucket.org/multicoreware/x265_git.git \
            "$RUNNER_TEMP/x265"

          X265_SOURCE="$RUNNER_TEMP/x265/source"
          X265_BUILD="$RUNNER_TEMP/x265-build"
          TARGET="aarch64-linux-android${ANDROID_API}"

          mkdir -p "$X265_BUILD" "$DEPS/lib" "$DEPS/include" "$DEPS/lib/pkgconfig"

          python3 - "$X265_SOURCE/CMakeLists.txt" "$ANDROID_API" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          api = sys.argv[2]
          content = path.read_text()
          pattern = re.compile(r'(?m)^(?P<indent>[ \t]*)ARGS[ \t]+\$\{ARM_ARGS\}(?P<rest>[^\n]*)$')
          matches = list(pattern.finditer(content))
          if not matches:
              raise SystemExit("No ARM_ARGS lines found in x265 CMakeLists.txt")
          def replace(match):
              return match.group("indent") + f"ARGS --target=aarch64-linux-android{api} " + "${ARM_ARGS}" + match.group("rest")
          path.write_text(pattern.sub(replace, content))
          print(f"Patched {len(matches)} ARM_ARGS lines.")
          PY

          TARGET_COUNT="$(
            grep -F -c -- "--target=${TARGET}" "$X265_SOURCE/CMakeLists.txt"
          )"
          test "$TARGET_COUNT" -gt 0

          build_x265_variant() {
            local variant="$1"
            shift

            echo "=== Configuring x265: $variant ==="

            cmake -S "$X265_SOURCE" -B "$X265_BUILD/$variant" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM="android-${ANDROID_API}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_C_COMPILER_TARGET="$TARGET" \
              -DCMAKE_CXX_COMPILER_TARGET="$TARGET" \
              -DENABLE_SHARED=OFF \
              -DENABLE_CLI=OFF \
              "$@"

            cmake --build "$X265_BUILD/$variant" \
              --parallel "$BUILD_JOBS"
          }

          build_x265_variant 10bit \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=OFF \
            -DEXPORT_C_API=OFF

          build_x265_variant 12bit \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=ON \
            -DEXPORT_C_API=OFF

          build_x265_variant 8bit \
            -DHIGH_BIT_DEPTH=OFF \
            -DMAIN12=OFF \
            -DEXPORT_C_API=ON \
            -DLINKED_10BIT=ON \
            -DLINKED_12BIT=ON \
            -D10BIT_LIBRARY="$X265_BUILD/10bit/libx265.a" \
            -D12BIT_LIBRARY="$X265_BUILD/12bit/libx265.a"

          install -Dm644 \
            "$X265_BUILD/8bit/libx265.a" \
            "$DEPS/lib/libx265.a"

          install -Dm644 \
            "$X265_SOURCE/x265.h" \
            "$DEPS/include/x265.h"

          X265_CONFIG_HEADER="$(
            find "$X265_BUILD/8bit" -type f \
              -name x265_config.h -print -quit
          )"

          if [ -z "$X265_CONFIG_HEADER" ]; then
            echo "ERROR: x265_config.h was not generated in the 8-bit build."
            find "$X265_BUILD" -type f -name x265_config.h -print
            exit 1
          fi

          install -Dm644 \
            "$X265_CONFIG_HEADER" \
            "$DEPS/include/x265_config.h"

          cat > "$DEPS/lib/pkgconfig/x265.pc" <<EOF
          prefix=$DEPS
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: x265
          Description: H.265/HEVC video encoder
          Version: $X265_VERSION
          Libs: -L\${libdir} -lx265
          Libs.private: -lc++ -lm -ldl
          Cflags: -I\${includedir}
          EOF

          test -s "$DEPS/lib/libx265.a"
          test -s "$DEPS/include/x265.h"
          test -s "$DEPS/include/x265_config.h"
          test -s "$DEPS/lib/pkgconfig/x265.pc"

          echo "x265 8-bit, 10-bit and 12-bit build completed successfully."
          
      - name: Build libvpx for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          VPX_VERSION=$(get_latest_tag "https://chromium.googlesource.com/webm/libvpx")
          echo "Latest libvpx version: $VPX_VERSION"

          git clone --depth 1 --branch "$VPX_VERSION" \
            https://chromium.googlesource.com/webm/libvpx \
            "$RUNNER_TEMP/libvpx"

          cd "$RUNNER_TEMP/libvpx"
          export CC="$CC" CXX="$CXX" AR="$AR" AS="$CC" LD="$CXX" STRIP="$STRIP" CROSS=""

          ./configure \
            --prefix="$DEPS" \
            --target=arm64-android-gcc \
            --disable-examples --disable-tools --disable-docs --disable-unit-tests \
            --disable-shared --enable-static --enable-pic --enable-vp8 --enable-vp9 \
            --disable-webm-io --disable-libyuv \
            --extra-cflags="--target=aarch64-linux-android${ANDROID_API} --sysroot=${SYSROOT}" \
            --extra-cxxflags="--target=aarch64-linux-android${ANDROID_API} --sysroot=${SYSROOT}"

          make -j"$BUILD_JOBS"
          make install

      - name: Build libaom for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          AOM_VERSION=$(get_latest_tag "https://aomedia.googlesource.com/aom")
          echo "Latest libaom version: $AOM_VERSION"

          AOM_SOURCE="$RUNNER_TEMP/libaom"
          AOM_BUILD="$RUNNER_TEMP/libaom-build"

          git clone --depth 1 --branch "$AOM_VERSION" \
            https://aomedia.googlesource.com/aom \
            "$AOM_SOURCE"

          cmake -S "$AOM_SOURCE" -B "$AOM_BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_TARGET="aarch64-linux-android${ANDROID_API}" \
            -DCMAKE_CXX_COMPILER_TARGET="aarch64-linux-android${ANDROID_API}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TESTS=OFF -DENABLE_EXAMPLES=OFF -DENABLE_TOOLS=OFF -DENABLE_DOCS=OFF -DENABLE_TESTDATA=OFF \
            -DCONFIG_AV1_ENCODER=1 -DCONFIG_AV1_DECODER=1 -DCONFIG_PIC=1 -DCONFIG_RUNTIME_CPU_DETECT=1 -DCONFIG_MULTITHREAD=1 -DAOM_TARGET_CPU=generic

          cmake --build "$AOM_BUILD" --parallel "$BUILD_JOBS"
          cmake --install "$AOM_BUILD"

      - name: Build audio libraries (Opus, Ogg, Vorbis, LAME, TwoLAME, Speex, SoXR)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP"
          export CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC"
          export CPPFLAGS="-I$DEPS/include" LDFLAGS="-L$DEPS/lib"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig" PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR
          mkdir -p "$DEPS/lib/pkgconfig"

          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          build_git_autotools() {
            local name="$1"
            local repo_url="$2"
            local configure_args="$3"
            local src="$RUNNER_TEMP/$name"

            rm -rf "$src"
            local tag
            tag=$(get_latest_tag "$repo_url")
            echo "Building $name latest tag: $tag"

            git clone --depth 1 --branch "$tag" "$repo_url" "$src"
            cd "$src"
            [ -x ./autogen.sh ] && ./autogen.sh
            [ -x ./configure ] || autoreconf -fi
            ./configure \
              --build="$(./config.guess 2>/dev/null || echo x86_64-pc-linux-gnu)" \
              --host=aarch64-linux-android \
              --prefix="$DEPS" \
              --enable-static \
              --disable-shared \
              $configure_args
            make -j"$BUILD_JOBS"
            make install
          }

          # Opus
          build_git_autotools opus https://github.com/xiph/opus.git "--disable-doc --disable-extra-programs"
          # Ogg
          build_git_autotools libogg https://github.com/xiph/ogg.git "--disable-examples --disable-oggtest"
          # Vorbis
          build_git_autotools libvorbis https://github.com/xiph/vorbis.git "--disable-examples --disable-oggtest"
          # LAME (using GitHub mirror)
          build_git_autotools lame https://github.com/rbrito/lame.git "--disable-frontend"
          if ! pkg-config --exists lame; then
            cat > "$DEPS/lib/pkgconfig/lame.pc" <<EOF
          prefix=$DEPS
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: lame
          Description: LAME MP3 encoder
          Version: 3.100
          Libs: -L\${libdir} -lmp3lame
          Libs.private: -lm
          Cflags: -I\${includedir}
          EOF
          fi
          # TwoLAME
          build_git_autotools twolame https://github.com/twolame/twolame.git "--disable-frontend"
          # Speex
          build_git_autotools speex https://github.com/xiph/speex.git "--disable-binaries --disable-examples"

          # SoXR (CMake)
          SOXR_TAG=$(get_latest_tag "https://github.com/chirlu/soxr.git")
          rm -rf "$RUNNER_TEMP/soxr" "$RUNNER_TEMP/soxr-build"
          git clone --depth 1 --branch "$SOXR_TAG" https://github.com/chirlu/soxr.git "$RUNNER_TEMP/soxr"
          cmake -S "$RUNNER_TEMP/soxr" -B "$RUNNER_TEMP/soxr-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF -DWITH_OPENMP=OFF -DBUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/soxr-build" --parallel "$BUILD_JOBS"
          cmake --install "$RUNNER_TEMP/soxr-build"

      - name: Build dav1d
        shell: bash
        run: |
          set -euo pipefail
          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          DAV1D_TAG=$(get_latest_tag "https://code.videolan.org/videolan/dav1d.git")
          echo "Latest dav1d version: $DAV1D_TAG"

          SRC="$RUNNER_TEMP/dav1d"
          BUILD="$RUNNER_TEMP/dav1d-build"
          CROSS_FILE="$RUNNER_TEMP/dav1d-cross.ini"

          git clone --depth 1 --branch "$DAV1D_TAG" https://code.videolan.org/videolan/dav1d.git "$SRC"

          cat > "$CROSS_FILE" <<EOF
          [binaries]
          c = '$CC'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = '$(command -v pkg-config)'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          [built-in options]
          c_args = ['-fPIC']
          EOF

          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig" PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          meson setup "$BUILD" "$SRC" --cross-file "$CROSS_FILE" --prefix "$DEPS" --libdir lib --buildtype release --default-library static -Denable_tools=false -Denable_tests=false
          ninja -C "$BUILD" -j"$BUILD_JOBS"
          ninja -C "$BUILD" install

      - name: Build SVT-AV1
        shell: bash
        run: |
          set -euo pipefail
          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          SVT_TAG=$(get_latest_tag "https://gitlab.com/AOMediaCodec/SVT-AV1.git")
          echo "Latest SVT-AV1 version: $SVT_TAG"

          SRC="$RUNNER_TEMP/SVT-AV1"
          BUILD="$RUNNER_TEMP/svt-av1-build"

          git clone --depth 1 --branch "$SVT_TAG" https://gitlab.com/AOMediaCodec/SVT-AV1.git "$SRC"
          cmake -S "$SRC" -B "$BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF -DBUILD_APPS=OFF -DBUILD_TESTING=OFF
          cmake --build "$BUILD" --parallel "$BUILD_JOBS"
          cmake --install "$BUILD"

      - name: Build FreeType
        shell: bash
        run: |
          set -euo pipefail
          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          FT_TAG=$(get_latest_tag "https://github.com/freetype/freetype.git" "^VER-[0-9-]")
          echo "Latest FreeType version: $FT_TAG"

          SRC="$RUNNER_TEMP/freetype"
          BUILD="$RUNNER_TEMP/freetype-build"

          git clone --depth 1 --branch "$FT_TAG" https://github.com/freetype/freetype.git "$SRC"
          cmake -S "$SRC" -B "$BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE -DFT_DISABLE_BZIP2=TRUE -DFT_DISABLE_PNG=TRUE -DFT_DISABLE_HARFBUZZ=TRUE -DFT_DISABLE_BROTLI=TRUE
          cmake --build "$BUILD" --parallel "$BUILD_JOBS"
          cmake --install "$BUILD"

      - name: Build FriBidi
        shell: bash
        run: |
          set -euo pipefail
          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          FRIBIDI_TAG=$(get_latest_tag "https://github.com/fribidi/fribidi.git")
          echo "Latest FriBidi version: $FRIBIDI_TAG"

          SRC="$RUNNER_TEMP/fribidi"
          BUILD="$RUNNER_TEMP/fribidi-build"

          git clone --depth 1 --branch "$FRIBIDI_TAG" https://github.com/fribidi/fribidi.git "$SRC"
          meson setup "$BUILD" "$SRC" --cross-file "$RUNNER_TEMP/dav1d-cross.ini" --prefix "$DEPS" --libdir lib --buildtype release --default-library static -Ddocs=false -Dtests=false -Dbin=false
          ninja -C "$BUILD" -j"$BUILD_JOBS"
          ninja -C "$BUILD" install

      - name: Build HarfBuzz
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig" PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          HB_TAG=$(get_latest_tag "https://github.com/harfbuzz/harfbuzz.git")
          echo "Latest HarfBuzz version: $HB_TAG"

          SRC="$RUNNER_TEMP/harfbuzz"
          BUILD="$RUNNER_TEMP/harfbuzz-build"

          git clone --depth 1 --branch "$HB_TAG" https://github.com/harfbuzz/harfbuzz.git "$SRC"
          meson setup "$BUILD" "$SRC" --cross-file "$RUNNER_TEMP/dav1d-cross.ini" --prefix "$DEPS" --libdir lib --buildtype release --default-library static -Ddocs=disabled -Dtests=disabled -Dintrospection=disabled -Dglib=disabled -Dcairo=disabled -Dicu=disabled -Dfreetype=enabled -Dgraphite2=disabled
          ninja -C "$BUILD" -j"$BUILD_JOBS"
          ninja -C "$BUILD" install

      - name: Build libwebp
        shell: bash
        run: |
          set -euo pipefail
          get_latest_tag() {
            local repo_url="$1"
