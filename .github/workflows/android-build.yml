      - name: Build libbluray
        shell: bash
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/libbluray-src"
          BUILD="$RUNNER_TEMP/libbluray-build"
          CROSS_FILE="$RUNNER_TEMP/android-arm64-meson.ini"

          # Verify required dependency libraries and headers.
          for file in \
            "$DEPS/lib/libfreetype.a" \
            "$DEPS/lib/libfontconfig.a" \
            "$DEPS/lib/libxml2.a" \
            "$DEPS/include/freetype2/ft2build.h" \
            "$DEPS/include/libxml2/libxml/parser.h"; do
            if [ ! -s "$file" ]; then
              echo "::error::Required dependency file missing: $file"
              exit 1
            fi
          done

          # Download libbluray and its bundled libudfread submodule.
          rm -rf "$SRC" "$BUILD"

          git clone --depth 1 \
            https://code.videolan.org/videolan/libbluray.git \
            "$SRC"

          cd "$SRC"
          git submodule update --init --recursive

          # Use dependencies installed for this Android build.
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          # Create a valid Meson cross-compilation file.
          cat > "$CROSS_FILE" <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['--sysroot=$SYSROOT', '-I$DEPS/include', '-I$DEPS/include/freetype2', '-I$DEPS/include/libxml2', '-fPIC']
          c_link_args = ['--sysroot=$SYSROOT', '-L$DEPS/lib']
          cpp_args = ['--sysroot=$SYSROOT', '-I$DEPS/include', '-I$DEPS/include/freetype2', '-I$DEPS/include/libxml2', '-fPIC']
          cpp_link_args = ['--sysroot=$SYSROOT', '-L$DEPS/lib']
          EOF

          # Install Ninja if it is not already available.
          python3 -m pip install --user meson ninja
          export PATH="$HOME/.local/bin:$PATH"

          meson --version
          ninja --version

          # Configure libbluray as a static Android ARM64 library.
          meson setup "$BUILD" "$SRC" \
            --cross-file "$CROSS_FILE" \
            --prefix="$DEPS" \
            --libdir=lib \
            --default-library=static \
            --buildtype=release \
            -Dbdj_jar=disabled \
            -Dfreetype=enabled \
            -Dfontconfig=enabled \
            -Dlibxml2=enabled

          # Build and install.
          meson compile -C "$BUILD" -j "$BUILD_JOBS"
          meson install -C "$BUILD"

          # Verify the outputs.
          test -s "$DEPS/lib/libbluray.a" || {
            echo "::error::libbluray static library was not produced."
            exit 1
          }

          test -f "$DEPS/include/libbluray/bluray.h" || {
            echo "::error::libbluray header was not installed."
            exit 1
          }

          echo "libbluray static library built successfully."
          ls -lh "$DEPS/lib/libbluray.a"
          ls -l "$DEPS/include/libbluray/bluray.h"

      - name: Verify and prepare librtmp pkg-config
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$DEPS/lib/pkgconfig"

          echo "=== Inspect librtmp installation ==="
          find "$DEPS" \( \
            -name 'librtmp.a' -o \
            -name 'rtmp.h' -o \
            -name 'librtmp.pc' \
          \) -print

          test -s "$DEPS/lib/librtmp.a" || {
