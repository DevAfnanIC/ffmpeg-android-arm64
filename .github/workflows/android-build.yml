name: Build FFmpeg Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_API: "24"
      FFMPEG_VERSION: "9.0.2"
      BUILD_JOBS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            curl \
            git \
            libtool \
            ninja-build \
            pkg-config \
            python3 \
            texinfo \
            yasm \
            nasm \
            xz-utils \
            zlib1g-dev

      - name: Install Android NDK
        run: |
          set -euo pipefail

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Set up Android toolchain
        run: |
          set -euo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> "$GITHUB_ENV"
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/android-arm64" >> "$GITHUB_ENV"
          echo "DEPS=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"

      - name: Create build directories
        run: |
          set -euo pipefail

          mkdir -p "$PREFIX"
          mkdir -p "$DEPS/lib/pkgconfig"
          mkdir -p "$DEPS/include"

      - name: Build x264
        run: |
          set -euo pipefail

          git clone --depth 1 https://code.videolan.org/videolan/x264.git \
            "$RUNNER_TEMP/x264"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CROSS="$RUNNER_TEMP/aarch64-linux-android-"

          # Map the tools x264's configure script expects to NDK tools.
          for tool in ar ranlib strip nm; do
            test -x "$TOOLCHAIN/bin/llvm-$tool"
            ln -sf "$TOOLCHAIN/bin/llvm-$tool" "${CROSS}${tool}"
          done

          # x264 checks for a strings utility. Use the host utility for
          # configure-time inspection; this tool does not generate target code.
          ln -sf "$(command -v strings)" "${CROSS}strings"

          cat > "${CROSS}gcc" <<EOF
          #!/bin/sh
          exec "$CC" "\$@"
          EOF

          cat > "${CROSS}g++" <<EOF
          #!/bin/sh
          exec "$CXX" "\$@"
          EOF

          chmod +x "${CROSS}gcc" "${CROSS}g++"
          export PATH="$RUNNER_TEMP:$TOOLCHAIN/bin:$PATH"

          cd "$RUNNER_TEMP/x264"

          ./configure \
            --prefix="$DEPS" \
            --host=aarch64-linux \
            --cross-prefix="$CROSS" \
            --sysroot="$SYSROOT" \
            --extra-cflags="-O2 -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl

          make -j"$BUILD_JOBS"
          make install

          test -s "$DEPS/lib/libx264.a"
          test -s "$DEPS/include/x264.h"

      - name: Build x265 8-bit, 10-bit and 12-bit
        run: |
          set -euo pipefail

          git clone --depth 1 --branch 4.1 \
            https://bitbucket.org/multicoreware/x265_git.git \
            "$RUNNER_TEMP/x265"

          X265_SOURCE="$RUNNER_TEMP/x265/source"
          X265_BUILD="$RUNNER_TEMP/x265-build"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          TARGET="aarch64-linux-android${ANDROID_API}"

          rm -rf "$X265_BUILD"
          mkdir -p "$X265_BUILD" "$DEPS/lib" "$DEPS/include" "$DEPS/lib/pkgconfig"

          # Use NDK API-specific compiler drivers. Do not inject host-target
          # compiler settings into CMake's ASM language configuration.
          build_x265_variant() {
            local variant="$1"
            shift

            cmake -S "$X265_SOURCE" -B "$X265_BUILD/$variant" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM="android-${ANDROID_API}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_C_COMPILER_TARGET="$TARGET" \
              -DCMAKE_CXX_COMPILER_TARGET="$TARGET" \
              -DENABLE_SHARED=OFF \
              -DENABLE_CLI=OFF \
              "$@"

            cmake --build "$X265_BUILD/$variant" --parallel "$BUILD_JOBS"
          }

          # Build 10-bit and 12-bit variants without exporting their C API.
          build_x265_variant 10bit \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=OFF \
            -DEXPORT_C_API=OFF

          build_x265_variant 12bit \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=ON \
            -DEXPORT_C_API=OFF

          # Build the 8-bit public library with both high-bit-depth libraries
          # linked into the combined archive.
          build_x265_variant 8bit \
            -DHIGH_BIT_DEPTH=OFF \
            -DMAIN12=OFF \
            -DEXPORT_C_API=ON \
            -DLINKED_10BIT=ON \
            -DLINKED_12BIT=ON \
            -D10BIT_LIBRARY="$X265_BUILD/10bit/libx265.a" \
            -D12BIT_LIBRARY="$X265_BUILD/12bit/libx265.a"

          cp "$X265_BUILD/8bit/libx265.a" "$DEPS/lib/libx265.a"
          cp "$X265_SOURCE/x265.h" "$DEPS/include/x265.h"

          cat > "$DEPS/lib/pkgconfig/x265.pc" <<EOF
          prefix=$DEPS
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: x265
          Description: H.265/HEVC video encoder
          Version: 4.1
          Libs: -L\${libdir} -lx265
          Libs.private: -lstdc++ -lm -ldl
          Cflags: -I\${includedir}
          EOF

          test -s "$DEPS/lib/libx265.a"
          test -s "$DEPS/include/x265.h"
          test -s "$DEPS/lib/pkgconfig/x265.pc"

          echo "x265 8/10/12-bit build completed."

      - name: Build libvpx
        run: |
          set -euo pipefail

          git clone --depth 1 --branch v1.15.2 \
            https://chromium.googlesource.com/webm/libvpx \
            "$RUNNER_TEMP/libvpx"

          cd "$RUNNER_TEMP/libvpx"

          ./configure \
            --prefix="$DEPS" \
            --target=arm64-android-gcc \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --disable-shared \
            --enable-static \
            --enable-pic \
            --enable-vp8 \
            --enable-vp9 \
            --disable-webm-io \
            --disable-libyuv \
            --sdk-path="$NDK"

          make -j"$BUILD_JOBS"
          make install

          test -s "$DEPS/lib/libvpx.a"

      - name: Build audio libraries
        run: |
          set -euo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export CFLAGS="-O2 -fPIC"
          export CXXFLAGS="-O2 -fPIC"
          export CPPFLAGS="-I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"

          build_autotools() {
            local name="$1"
            local url="$2"
            local configure_args="$3"
            local src="$RUNNER_TEMP/$name"

            rm -rf "$src"
            mkdir -p "$src"

            curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/$name.tar.gz"

            tar -xzf "$RUNNER_TEMP/$name.tar.gz" \
              --strip-components=1 \
              -C "$src"

            cd "$src"

            ./configure \
              --build="$(./config.guess 2>/dev/null || echo x86_64-pc-linux-gnu)" \
              --host=aarch64-linux-android \
              --prefix="$DEPS" \
              --enable-static \
              --disable-shared \
              $configure_args

            make -j"$BUILD_JOBS"
            make install
          }

          build_autotools opus \
            https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz \
            "--disable-doc --disable-extra-programs"

          build_autotools libogg \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz \
            "--disable-examples --disable-oggtest"

          build_autotools libvorbis \
            https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz \
            "--disable-examples --disable-oggtest"

          build_autotools lame \
            https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz \
            "--disable-frontend"

          build_autotools twolame \
            https://downloads.sourceforge.net/project/twolame/twolame/0.4.0/twolame-0.4.0.tar.gz \
            "--disable-frontend"

          build_autotools speex \
            https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz \
            "--disable-binaries --disable-examples"

          git clone --depth 1 --branch 0.1.3 \
            https://github.com/chirlu/soxr.git \
            "$RUNNER_TEMP/soxr"

          cmake -S "$RUNNER_TEMP/soxr" -B "$RUNNER_TEMP/soxr-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_OPENMP=OFF \
            -DBUILD_TESTS=OFF

          cmake --build "$RUNNER_TEMP/soxr-build" --parallel "$BUILD_JOBS"
          cmake --install "$RUNNER_TEMP/soxr-build"

          echo "=== Installed audio libraries ==="
          find "$DEPS/lib" -maxdepth 2 \
            \( -name '*.a' -o -name '*.pc' \) -print | sort

          test -s "$DEPS/lib/libopus.a"
          test -s "$DEPS/lib/libogg.a"
          test -s "$DEPS/lib/libvorbis.a"
          test -s "$DEPS/lib/libvorbisenc.a"
          test -s "$DEPS/lib/libmp3lame.a"
          test -s "$DEPS/lib/libtwolame.a"
          test -s "$DEPS/lib/libspeex.a"
          test -s "$DEPS/lib/libsoxr.a"

      - name: Configure FFmpeg
        run: |
          set -euo pipefail

          git clone --depth 1 --branch "n${FFMPEG_VERSION}" \
            https://git.ffmpeg.org/ffmpeg.git \
            "$RUNNER_TEMP/ffmpeg"

          cd "$RUNNER_TEMP/ffmpeg"

          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          export CFLAGS="-O2 -fPIC -I$DEPS/include"
          export CXXFLAGS="-O2 -fPIC -I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"
          export LIBS="-lc++ -lm -ldl"

          ./configure \
            --prefix="$PREFIX" \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --sysroot="$SYSROOT" \
            --cc="$CC" \
            --cxx="$CXX" \
            --ar="$AR" \
            --ranlib="$RANLIB" \
            --strip="$STRIP" \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libmp3lame \
            --enable-libtwolame \
            --enable-libspeex \
            --enable-libsoxr \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --extra-cflags="-I$DEPS/include -O2 -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --extra-libs="-lc++ -lm -ldl"

          echo "=== FFmpeg configure summary ==="
          grep -E 'CONFIG_(LIBX264|LIBX265|LIBVPX|LIBOPUS|LIBVORBIS|LIBMP3LAME|LIBTWOLAME|LIBSPEEX|LIBSOXR)=' config.h || true

      - name: Build FFmpeg
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/ffmpeg"

          make -j"$BUILD_JOBS"
          make install

          test -x "$PREFIX/bin/ffmpeg"
          "$PREFIX/bin/ffmpeg" -version

      - name: Verify FFmpeg configuration
        run: |
          set -euo pipefail

          FFMPEG="$PREFIX/bin/ffmpeg"

          echo "=== External library configuration ==="
          grep -E 'CONFIG_(LIBX264|LIBX265|LIBVPX|LIBOPUS|LIBVORBIS|LIBMP3LAME|LIBTWOLAME|LIBSPEEX|LIBSOXR)=' \
            "$RUNNER_TEMP/ffmpeg/config.h" || true

          echo "=== Encoders ==="
          "$FFMPEG" -hide_banner -encoders

          echo "=== Decoders ==="
          "$FFMPEG" -hide_banner -decoders

          for encoder in \
            libx264 \
            libx265 \
            libvpx_vp8 \
            libvpx_vp9 \
            libopus \
            libvorbis \
            libmp3lame \
            libtwolame; do
            "$FFMPEG" -hide_banner -h "encoder=$encoder" >/dev/null
          done

          "$FFMPEG" -hide_banner -h decoder=speex >/dev/null

          echo "=== ELF architecture ==="
          file "$FFMPEG"

          echo "=== Shared-library dependencies ==="
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" || true

      - name: Package Android ARM64 build
        run: |
          set -euo pipefail

          PACKAGE="$RUNNER_TEMP/package"
          FFMPEG="$PREFIX/bin/ffmpeg"

          mkdir -p "$PACKAGE/bin" "$PACKAGE/lib"

          cp "$FFMPEG" "$PACKAGE/bin/ffmpeg"

          # Bundle any shared libraries required by the executable.
          # Static archives are preferred; this handles any remaining NEEDED
          # entries that resolve to shared objects in the NDK sysroot.
          NEEDED="$RUNNER_TEMP/ffmpeg-needed.txt"
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" \
            | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' > "$NEEDED"

          while IFS= read -r lib; do
            [ -n "$lib" ] || continue

            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libc++_shared.so)
                # Android system libraries are supplied by the OS.
                # libc++_shared.so is handled separately below if required.
                if [ "$lib" = "libc++_shared.so" ]; then
                  find "$TOOLCHAIN/sysroot" -name "$lib" -type f -print -quit \
                    | while IFS= read -r path; do cp "$path" "$PACKAGE/lib/"; done
                fi
                ;;
              *)
                find "$DEPS/lib" "$TOOLCHAIN/sysroot" \
                  -name "$lib" -type f -print -quit \
                  | while IFS= read -r path; do cp "$path" "$PACKAGE/lib/"; done
                ;;
            esac
          done < "$NEEDED"

          cat > "$PACKAGE/run-ffmpeg.sh" <<'EOF'
          #!/system/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/bin/ffmpeg" "$@"
          EOF

          chmod +x "$PACKAGE/run-ffmpeg.sh"

          cat > "$PACKAGE/README.txt" <<EOF
          FFmpeg ${FFMPEG_VERSION} Android ARM64

          Architecture: ARM64 / aarch64
          Minimum Android API: ${ANDROID_API}

          Run in Termux:
            chmod +x run-ffmpeg.sh
            ./run-ffmpeg.sh -version
            ./run-ffmpeg.sh -encoders
            ./run-ffmpeg.sh -decoders

          External libraries configured:
            x264, x265, libvpx, Opus, Vorbis, MP3 LAME,
            TwoLAME, Speex, SoXR.

          The FFmpeg executable is built with static FFmpeg libraries.
          Android system libraries may remain dynamically linked.
          EOF

          echo "=== Package contents ==="
          find "$PACKAGE" -maxdepth 3 -type f -print | sort

          cd "$RUNNER_TEMP"
          tar -czf ffmpeg-android-arm64.tar.gz package

          test -s "$RUNNER_TEMP/ffmpeg-android-arm64.tar.gz"

      - name: Upload FFmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
