
name: Android NDK Toolchain Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip

      - name: Download Android NDK
        run: |
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            -o "$RUNNER_TEMP/ndk.zip"

      - name: Extract Android NDK
        run: |
          mkdir -p "$RUNNER_TEMP/android-ndk"
          unzip -q "$RUNNER_TEMP/ndk.zip" \
            -d "$RUNNER_TEMP/android-ndk"

          echo "$RUNNER_TEMP/android-ndk/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_PATH"

      - name: Verify Android ARM64 compiler
        run: |
          aarch64-linux-android24-clang --version

      - name: Verify LLVM tools
        run: |
          llvm-readelf --version
          echo "NDK toolchain check passed."
          
