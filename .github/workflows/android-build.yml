
name: FFmpeg Android ARM64 Executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_API: "24"
      FFMPEG_VERSION: "9.0.2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl unzip xz-utils make perl cmake ninja-build nasm \
            git pkg-config

      - name: Download Android NDK
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            -o "$RUNNER_TEMP/ndk.zip"

          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"

          echo "NDK=$RUNNER_TEMP/android-ndk-r27d" >> "$GITHUB_ENV"

          echo "$RUNNER_TEMP/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          set -euo pipefail

          aarch64-linux-android24-clang --version
          llvm-ar --version
          llvm-ranlib --version
          llvm-strings --version

      - name: Build x264 static library
        run: |
          set -euo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          PREFIX="$RUNNER_TEMP/deps"
          CROSS="$TOOLCHAIN/bin/aarch64-linux-android-"

          # x264 expects these cross-tool names.
          ln -sf "$TOOLCHAIN/bin/llvm-ar" "${CROSS}ar"
          ln -sf "$TOOLCHAIN/bin/llvm-ranlib" "${CROSS}ranlib"
          ln -sf "$TOOLCHAIN/bin/llvm-strip" "${CROSS}strip"
          ln -sf "$TOOLCHAIN/bin/llvm-nm" "${CROSS}nm"
          ln -sf "$TOOLCHAIN/bin/llvm-strings" "${CROSS}strings"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          export AS="$CC"
          export AR="${CROSS}ar"
          export RANLIB="${CROSS}ranlib"
          export STRIP="${CROSS}strip"

          git clone --depth 1 \
            https://github.com/mirror/x264.git \
            "$RUNNER_TEMP/x264"

          cd "$RUNNER_TEMP/x264"

          ./configure \
            --prefix="$PREFIX" \
            --host=aarch64-linux \
            --cross-prefix="$CROSS" \
            --cc="$CC" \
            --as="$AS" \
            --sysroot="$TOOLCHAIN/sysroot" \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl

          make -j2
          make install

          test -s "$PREFIX/lib/libx264.a"

          echo "x264 built successfully."

      - name: Build x265 static library
        run: |
          set -euo pipefail

          PREFIX="$RUNNER_TEMP/deps"

          git clone --depth 1 \
            https://github.com/videolan/x265.git \
            "$RUNNER_TEMP/x265"

          cmake -S "$RUNNER_TEMP/x265/source" \
            -B "$RUNNER_TEMP/x265-build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DENABLE_PIC=ON \
            -DENABLE_ASSEMBLY=OFF \
            -DENABLE_LIBNUMA=OFF

          cmake --build "$RUNNER_TEMP/x265-build" --parallel 2
          cmake --install "$RUNNER_TEMP/x265-build"

          test -s "$PREFIX/lib/libx265.a"
          test -f "$PREFIX/include/x265.h"

          mkdir -p "$PREFIX/lib/pkgconfig"

          cat > "$PREFIX/lib/pkgconfig/x265.pc" <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: x265
          Description: H.265/HEVC video encoder
          Version: 4.1
          Libs: -L\${libdir} -lx265
          Libs.private: -lstdc++ -lm
          Cflags: -I\${includedir}
          EOF

          echo "x265 static library and pkg-config file created."
          cat "$PREFIX/lib/pkgconfig/x265.pc"
      - name: Download FFmpeg source
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/ffmpeg.tar.xz"

          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" \
            -C "$RUNNER_TEMP"

          echo "FFMPEG_SRC=$RUNNER_TEMP/ffmpeg-${FFMPEG_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Configure FFmpeg executable
        run: |
          set -euo pipefail

          PREFIX="$RUNNER_TEMP/ffmpeg-install"
          DEPS="$RUNNER_TEMP/deps"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"

          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"

          cd "$FFMPEG_SRC"

          pkg-config --modversion x265
          pkg-config --cflags --libs --static x265
          
          ./configure \
            --prefix="$PREFIX" \
            --arch=aarch64 \
            --target-os=android \
            --enable-cross-compile \
            --sysroot="$SYSROOT" \
            --cc="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" \
            --cxx="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" \
            --ar="$TOOLCHAIN/bin/llvm-ar" \
            --ranlib="$TOOLCHAIN/bin/llvm-ranlib" \
            --nm="$TOOLCHAIN/bin/llvm-nm" \
            --strip="$TOOLCHAIN/bin/llvm-strip" \
            --pkg-config=pkg-config \
            --pkg-config-flags=--static \
            --extra-cflags="-I$DEPS/include" \
            --extra-ldflags="-L$DEPS/lib" \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-debug \
            --disable-autodetect

      - name: Compile FFmpeg executable
        run: |
          set -euo pipefail

          cd "$FFMPEG_SRC"

          make -j2
          make install

          test -x "$RUNNER_TEMP/ffmpeg-install/bin/ffmpeg"

          echo "FFmpeg executable built successfully."

      - name: Verify executable and encoders
        run: |
          set -euo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          FFMPEG="$RUNNER_TEMP/ffmpeg-install/bin/ffmpeg"

          test -s "$FFMPEG"

          echo "Checking executable architecture..."
          "$TOOLCHAIN/llvm-readelf" -h "$FFMPEG" \
            | tee "$RUNNER_TEMP/elf-header.txt"

          grep -q "AArch64" "$RUNNER_TEMP/elf-header.txt"

          echo "Checking linked libraries..."
          "$TOOLCHAIN/llvm-readelf" -d "$FFMPEG" \
            | tee "$RUNNER_TEMP/dynamic-section.txt"

          echo "Checking FFmpeg encoder configuration..."
          grep -E \
            'CONFIG_LIBX264_ENCODER|CONFIG_LIBX265_ENCODER' \
            "$FFMPEG_SRC/config.h" || true

          if grep -q '^#define CONFIG_LIBX264_ENCODER 1$' \
              "$FFMPEG_SRC/config.h"; then
            echo "libx264 encoder: enabled"
          else
            echo "ERROR: libx264 encoder is not enabled"
            exit 1
          fi

          if grep -q '^#define CONFIG_LIBX265_ENCODER 1$' \
              "$FFMPEG_SRC/config.h"; then
            echo "libx265 encoder: enabled"
          else
            echo "ERROR: libx265 encoder is not enabled"
            exit 1
          fi

          echo "ARM64 executable and both encoder configurations verified."
    
      - name: Package executable
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/package"

          cp "$RUNNER_TEMP/ffmpeg-install/bin/ffmpeg" \
            "$RUNNER_TEMP/package/ffmpeg"

          chmod +x "$RUNNER_TEMP/package/ffmpeg"

          cat > "$RUNNER_TEMP/package/README.txt" <<'EOF'
          FFmpeg 9.0.2 Android ARM64 executable

          Target ABI: arm64-v8a
          Minimum Android API: 24

          Intended for compatible Android ARM64 environments.
          This is an Android executable, not a Linux x86-64 executable.

          This build enables FFmpeg's GPL components and the external
          libx264 and libx265 encoders.

          The executable may still require Android system shared libraries.
          EOF

          tar -czf "$RUNNER_TEMP/ffmpeg-9.0.2-android-arm64-executable.tar.gz" \
            -C "$RUNNER_TEMP/package" .

      - name: Upload FFmpeg executable
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-9.0.2-android-arm64-executable
          path: ${{ runner.temp }}/ffmpeg-9.0.2-android-arm64-executable.tar.gz
          if-no-files-found: error
          retention-days: 14
          
