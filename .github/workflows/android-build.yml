          echo "=== Clone Codec2 ==="
          cd "$RUNNER_TEMP"
          rm -rf codec2-src
          git clone --depth 1 https://github.com/drowe67/codec2.git codec2-src
          cd codec2-src

          echo "=== Build host-native codebook generator ==="
          # Build the generator for the GitHub Actions Linux host.
          env -u CC -u CXX -u AR -u RANLIB cmake \
            -S . -B build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNITTEST=OFF \
            -DLPCNET=OFF

          cmake --build build-host \
            --target generate_codebook \
            --parallel "$BUILD_JOBS"

          HOST_GENERATOR="$RUNNER_TEMP/codec2-src/build-host/src/generate_codebook"

          if [ ! -x "$HOST_GENERATOR" ]; then
            echo "ERROR: Host generator not found: $HOST_GENERATOR" >&2
            find build-host -name generate_codebook -type f -print
            exit 1
          fi

          file "$HOST_GENERATOR" | tee "$RUNNER_TEMP/codec2-host-generator.txt"

          if ! grep -qE 'x86-64|x86_64' "$RUNNER_TEMP/codec2-host-generator.txt"; then
            echo "ERROR: Generator is not a host x86-64 executable" >&2
            exit 1
          fi

          echo "=== Patch Codec2 native-generator block ==="
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("src/CMakeLists.txt")
          source = path.read_text()

          # Replace the cross-compiling branch that creates codec2_native.
          pattern = re.compile(
              r'if\s*\(\s*CMAKE_CROSSCOMPILING\s*\)'
              r'(?:(?!if\s*\(\s*CMAKE_CROSSCOMPILING\s*\)).)*?'
              r'ExternalProject_Add\s*\(\s*codec2_native\b.*?'
              r'add_dependencies\s*\(\s*generate_codebook\s+codec2_native\s*\)'
              r'(?:(?!endif\s*\(\s*CMAKE_CROSSCOMPILING\s*\)).)*?'
              r'endif\s*\(\s*CMAKE_CROSSCOMPILING\s*\)',
              re.S
          )

          replacement = '''if(CMAKE_CROSSCOMPILING)
              if(NOT DEFINED GENERATE_CODEBOOK OR NOT EXISTS "${GENERATE_CODEBOOK}")
                  message(FATAL_ERROR "GENERATE_CODEBOOK must point to a runnable host executable")
              endif()
              add_executable(generate_codebook IMPORTED GLOBAL)
              set_target_properties(generate_codebook PROPERTIES
                  IMPORTED_LOCATION "${GENERATE_CODEBOOK}")
          else(CMAKE_CROSSCOMPILING)
              add_executable(generate_codebook generate_codebook.c)
              target_link_libraries(generate_codebook m)
              export(TARGETS generate_codebook
                  FILE ${CMAKE_BINARY_DIR}/ImportExecutables.cmake)
          endif(CMAKE_CROSSCOMPILING)'''

          updated, count = pattern.subn(
              lambda match: replacement, source, count=1
          )

          if count != 1:
              print("ERROR: Could not locate Codec2's expected native-generator block.")
              for i, line in enumerate(source.splitlines(), 1):
                  if any(term in line for term in (
                      "CMAKE_CROSSCOMPILING",
                      "ExternalProject_Add",
                      "codec2_native",
                      "add_dependencies(generate_codebook"
                  )):
                      print(f"{i}: {line}")
              sys.exit(1)

          path.write_text(updated)
          print("Successfully patched src/CMakeLists.txt.")
          PY

          echo "=== Configure Codec2 for Android ARM64 ==="
          # Rename the two symbols that conflict with Speex.
          CODEC2_SYMBOL_FLAGS="-Dlpc_to_lsp=codec2_lpc_to_lsp -Dlsp_to_lpc=codec2_lsp_to_lpc"

          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="$ANDROID_API" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNITTEST=OFF \
            -DLPCNET=OFF \
            -DGENERATE_CODEBOOK="$HOST_GENERATOR" \
            -DCMAKE_C_FLAGS="$CODEC2_SYMBOL_FLAGS"

          echo "=== Build Codec2 ==="
          cmake --build build-android --parallel "$BUILD_JOBS"

          echo "=== Install Codec2 ==="
          cmake --install build-android

          echo "=== Validate Codec2 installation ==="
          if [ ! -f "$DEPS/lib/libcodec2.a" ]; then
            echo "ERROR: libcodec2.a was not installed" >&2
            find "$DEPS" -iname '*codec2*' -print
            exit 1
          fi

          if [ ! -f "$DEPS/include/codec2/codec2.h" ] && \
             [ ! -f "$DEPS/include/codec2.h" ]; then
            echo "ERROR: Codec2 headers were not found under $DEPS/include" >&2
            find "$DEPS/include" -iname '*codec2*' -print
            exit 1
          fi

          echo "=== Verify renamed Codec2 symbols ==="
          NM="$TOOLCHAIN/bin/llvm-nm"

          if [ ! -x "$NM" ]; then
            echo "ERROR: NDK llvm-nm not found at $NM" >&2
            ls -la "$TOOLCHAIN/bin/"*nm* || true
            exit 1
          fi

          echo "--- Defined renamed symbols ---"
          if ! "$NM" -g --defined-only "$DEPS/lib/libcodec2.a" \
            | grep -E '[[:space:]]codec2_(lpc_to_lsp|lsp_to_lpc)$'; then
            echo "ERROR: Expected renamed Codec2 symbols were not found." >&2
            echo "--- Matching symbols in archive ---"
            "$NM" -g "$DEPS/lib/libcodec2.a" \
              | grep -E 'lpc_to_lsp|lsp_to_lpc' || true
            exit 1
          fi

          echo "--- Check original conflicting symbols are absent ---"
          if "$NM" -g --defined-only "$DEPS/lib/libcodec2.a" \
            | grep -E '[[:space:]](lpc_to_lsp|lsp_to_lpc)$'; then
            echo "ERROR: Original conflicting symbols remain in libcodec2.a" >&2
            exit 1
          fi

          echo "=== Codec2 build and symbol checks completed ==="
          ls -lh "$DEPS/lib/libcodec2.a"
          
      - name: Build FDK-AAC
