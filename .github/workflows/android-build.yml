            https://github.com/harfbuzz/harfbuzz.git "$SRC"

          echo "=== Configure HarfBuzz ==="
          meson setup "$BUILD" "$SRC" \
            --cross-file "$RUNNER_TEMP/dav1d-cross.ini" \
            --prefix "$DEPS" \
            --libdir lib \
            --buildtype release \
            --default-library static \
            -Ddocs=disabled \
            -Dtests=disabled \
            -Dintrospection=disabled \
            -Dglib=disabled \
            -Dcairo=disabled \
            -Dicu=disabled \
            -Dfreetype=enabled \
            -Dgraphite2=disabled

          echo "=== Build HarfBuzz ==="
          ninja -C "$BUILD" -j"$BUILD_JOBS"

          echo "=== Install HarfBuzz ==="
