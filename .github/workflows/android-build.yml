name: Build FFmpeg Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_API: "24"
      BUILD_JOBS: "2"
      TARGET: aarch64-linux-android
      ABI: arm64-v8a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake curl git \
            libtool libtool-bin ninja-build pkg-config \
            python3 python3-pip texinfo yasm nasm xz-utils \
            zlib1g-dev file gettext autopoint bison flex \
            gperf help2man perl

          python3 -m pip install --user --break-system-packages \
            --upgrade "meson>=1.11.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$PATH"
          "$HOME/.local/bin/meson" --version

      - name: Set up Android NDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_NDK_LATEST_HOME:-}" || {
            echo "::error::ANDROID_NDK_LATEST_HOME is unavailable."
            exit 1
          }
          test -f "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"
          echo "SYSROOT=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/android-arm64" >> "$GITHUB_ENV"
          echo "DEPS=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"

      - name: Set up compiler and shared build helpers
        shell: bash
        run: |
          set -euo pipefail
          T="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$T/bin/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$T/bin/aarch64-linux-android${ANDROID_API}-clang++"

          echo "CC=$T/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$T/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$T/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$T/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$T/bin/llvm-strip" >> "$GITHUB_ENV"

          mkdir -p "$PREFIX" "$DEPS/include" "$DEPS/lib/pkgconfig"

          cat > "$RUNNER_TEMP/build-common.sh" <<'COMMON'
          set -euo pipefail
          export PATH="$HOME/.local/bin:$TOOLCHAIN/bin:$PATH"
          export CC CXX AR RANLIB STRIP
          export CFLAGS="-O2 -fPIC"
          export CXXFLAGS="-O2 -fPIC"
          export CPPFLAGS="-I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          latest_tag() {
            local repo="$1" pattern="$2" tags result
            tags="$(git ls-remote --tags --refs "$repo")" || {
              echo "::error::Could not query tags for $repo" >&2
              return 1
            }
            result="$(
              printf '%s\n' "$tags" |
              awk '{sub(/^refs\/tags\//, "", $2); print $2}' |
              grep -E "$pattern" |
              grep -viE '(^|[._-])(rc|beta|alpha|dev|pre|preview)([._-]?[0-9]*)?$' |
              sort -Vu | tail -n 1
            )" || true
            if [ -z "${result:-}" ]; then
              echo "::error::No matching stable tag for $repo ($pattern)" >&2
              return 1
            fi
            printf '%s\n' "$result"
          }

          clone_tag() {
            local repo="$1" tag="$2" dest="$3"
            rm -rf "$dest"
            git clone --depth 1 --branch "$tag" "$repo" "$dest"
          }

          cmake_android() {
            local src="$1" build="$2"
            shift 2
            cmake -S "$src" -B "$build" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM="android-${ANDROID_API}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DBUILD_SHARED_LIBS=OFF "$@"
            cmake --build "$build" --parallel "$BUILD_JOBS"
            cmake --install "$build"
          }

          meson_android() {
            local src="$1" build="$2"
            shift 2
            meson setup "$build" "$src" \
              --cross-file "$RUNNER_TEMP/android-cross.ini" \
              --prefix "$DEPS" --libdir lib \
              --buildtype release --default-library static "$@"
            ninja -C "$build" -j"$BUILD_JOBS"
            ninja -C "$build" install
          }
          COMMON

          cat > "$RUNNER_TEMP/android-cross.ini" <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = '$(command -v pkg-config)'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          [built-in options]
          c_args = ['-O2', '-fPIC']
          cpp_args = ['-O2', '-fPIC']
          EOF

      - name: Build x264
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          SRC="$RUNNER_TEMP/x264"
          clone_tag https://code.videolan.org/videolan/x264.git \
            "$(latest_tag https://code.videolan.org/videolan/x264.git '^[0-9]+$')" "$SRC"

          CROSS="$RUNNER_TEMP/aarch64-linux-android-"
          for tool in ar ranlib strip nm; do
            ln -sf "$TOOLCHAIN/bin/llvm-$tool" "${CROSS}${tool}"
          done
          ln -sf "$(command -v strings)" "${CROSS}strings"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$CC" > "${CROSS}gcc"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$CXX" > "${CROSS}g++"
          chmod +x "${CROSS}gcc" "${CROSS}g++"
          export PATH="$RUNNER_TEMP:$PATH"

          cd "$SRC"
          ./configure --prefix="$DEPS" --host=aarch64-linux \
            --cross-prefix="$CROSS" --sysroot="$SYSROOT" \
            --extra-cflags="-O2 -fPIC" --extra-ldflags="-L$DEPS/lib" \
            --enable-static --enable-pic --disable-cli --disable-opencl
          make -j"$BUILD_JOBS"
          make install
          test -s "$DEPS/lib/libx264.a"

      - name: Build x265 (8-bit, 10-bit and 12-bit)
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/Multicorewareinc/x265.git
          TAG="$(latest_tag "$REPO" '^[0-9]+(\.[0-9]+)+$')"
          SRC="$RUNNER_TEMP/x265"
          clone_tag "$REPO" "$TAG" "$SRC"
          test -f "$SRC/source/CMakeLists.txt"

          BASE="$RUNNER_TEMP/x265-build"
          rm -rf "$BASE"
          mkdir -p "$BASE"

          x265_variant() {
            local name="$1"
            shift
            cmake -S "$SRC/source" -B "$BASE/$name" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM="android-${ANDROID_API}" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_INSTALL_PREFIX="$BASE/$name/install" \
              -DENABLE_SHARED=OFF -DENABLE_CLI=OFF "$@"
            cmake --build "$BASE/$name" --parallel "$BUILD_JOBS"
          }

          x265_variant 10bit -DHIGH_BIT_DEPTH=ON -DMAIN12=OFF -DEXPORT_C_API=OFF
          x265_variant 12bit -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DEXPORT_C_API=OFF
          x265_variant 8bit \
            -DHIGH_BIT_DEPTH=OFF -DMAIN12=OFF -DEXPORT_C_API=ON \
            -DLINKED_10BIT=ON -DLINKED_12BIT=ON \
            -D10BIT_LIBRARY="$BASE/10bit/libx265.a" \
            -D12BIT_LIBRARY="$BASE/12bit/libx265.a"

          test -s "$BASE/8bit/libx265.a"
          test -s "$BASE/10bit/libx265.a"
          test -s "$BASE/12bit/libx265.a"
          install -Dm644 "$BASE/8bit/libx265.a" "$DEPS/lib/libx265.a"
          install -Dm644 "$SRC/source/x265.h" "$DEPS/include/x265.h"
          HEADER="$(find "$BASE/8bit" -name x265_config.h -print -quit)"
          test -n "$HEADER"
          install -Dm644 "$HEADER" "$DEPS/include/x265_config.h"

          # Put the linked bit-depth archives into the final archive so
          # consumers of libx265.a can resolve all three encoder variants.
          TMP="$BASE/combined"
          mkdir -p "$TMP"
          cd "$TMP"
          "$AR" x "$BASE/8bit/libx265.a"
          "$AR" x "$BASE/10bit/libx265.a"
          "$AR" x "$BASE/12bit/libx265.a"
          "$AR" cr "$DEPS/lib/libx265-combined.a" ./*.o
          "$RANLIB" "$DEPS/lib/libx265-combined.a"
          # The normal 8-bit archive contains references to the linked variants;
          # retain the separate archives for FFmpeg's static link.
          cat > "$DEPS/lib/pkgconfig/x265.pc" <<EOF
          prefix=$DEPS
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: x265
          Description: x265 HEVC encoder
          Version: $TAG
          Libs: -L\${libdir} -lx265
          Libs.private: -lx265-combined -lc++ -lm -ldl
          Cflags: -I\${includedir}
          EOF
          test -s "$DEPS/lib/libx265.a"

      - name: Build libvpx
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://chromium.googlesource.com/webm/libvpx
          TAG="$(latest_tag "$REPO" '^v?[0-9]+\.[0-9]+\.[0-9]+$')"
          SRC="$RUNNER_TEMP/libvpx"
          clone_tag "$REPO" "$TAG" "$SRC"
          cd "$SRC"
          ./configure --prefix="$DEPS" --target=arm64-android-gcc \
            --disable-examples --disable-tools --disable-docs \
            --disable-unit-tests --disable-shared --enable-static \
            --enable-pic --enable-vp8 --enable-vp9 \
            --disable-webm-io --disable-libyuv
          make -j"$BUILD_JOBS"
          make install
          test -s "$DEPS/lib/libvpx.a"

      - name: Build libaom
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://aomedia.googlesource.com/aom
          TAG="$(latest_tag "$REPO" '^v?[0-9]+\.[0-9]+\.[0-9]+$')"
          SRC="$RUNNER_TEMP/libaom"
          BUILD="$RUNNER_TEMP/libaom-build"
          clone_tag "$REPO" "$TAG" "$SRC"
          cmake_android "$SRC" "$BUILD" \
            -DENABLE_TESTS=OFF -DENABLE_EXAMPLES=OFF \
            -DENABLE_TOOLS=OFF -DENABLE_DOCS=OFF \
            -DCONFIG_AV1_ENCODER=1 -DCONFIG_AV1_DECODER=1 \
            -DCONFIG_PIC=1 -DAOM_TARGET_CPU=generic
          test -s "$DEPS/lib/libaom.a"

      - name: Build audio libraries
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"

          build_autotools() {
            local name="$1" repo="$2" pattern="$3" args="$4"
            local tag src
            tag="$(latest_tag "$repo" "$pattern")"
            src="$RUNNER_TEMP/$name"
            clone_tag "$repo" "$tag" "$src"
            cd "$src"

            for f in config.sub config.guess; do
              if [ -f "$f" ]; then
                curl -fsSL --retry 3 \
                  "https://raw.githubusercontent.com/gcc-mirror/gcc/master/$f" -o "$f"
                chmod +x "$f"
              fi
            done

            if [ -x ./autogen.sh ]; then ./autogen.sh; fi
            if [ ! -x ./configure ]; then autoreconf -fi; fi
            ./configure --build=x86_64-pc-linux-gnu \
              --host=aarch64-linux-android --prefix="$DEPS" \
              --enable-static --disable-shared $args
            make -j"$BUILD_JOBS"
            if [ "$name" = twolame ]; then
              make -C libtwolame install
            else
              make install
            fi
          }

          build_autotools opus https://github.com/xiph/opus.git \
            '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            '--disable-doc --disable-extra-programs'
          build_autotools libogg https://github.com/xiph/ogg.git \
            '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            '--disable-examples --disable-oggtest'
          build_autotools libvorbis https://github.com/xiph/vorbis.git \
            '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            '--disable-examples --disable-oggtest --disable-docs'
          build_autotools lame https://github.com/rbrito/lame.git \
            '^RELEASE__[0-9_]+$' '--disable-frontend'
          build_autotools twolame https://github.com/njh/twolame.git \
            '^[0-9]+\.[0-9]+(\.[0-9]+)?$' '--disable-frontend'
          build_autotools speex https://github.com/xiph/speex.git \
            '^Speex-[0-9].*$' '--disable-binaries --disable-examples'

          # SoXR uses CMake.
          REPO=https://github.com/chirlu/soxr.git
          TAG="$(latest_tag "$REPO" '^[0-9]+\.[0-9]+\.[0-9]+$')"
          SRC="$RUNNER_TEMP/soxr"
          clone_tag "$REPO" "$TAG" "$SRC"
          cmake_android "$SRC" "$RUNNER_TEMP/soxr-build" \
            -DWITH_OPENMP=OFF -DBUILD_TESTS=OFF

          for lib in libopus.a libogg.a libvorbis.a libmp3lame.a libtwolame.a libspeex.a; do
            test -s "$DEPS/lib/$lib" || {
              echo "::error::Missing $DEPS/lib/$lib"
              exit 1
            }
          done
          test -s "$DEPS/lib/libsoxr.a"

      - name: Build dav1d
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://code.videolan.org/videolan/dav1d.git
          TAG="$(latest_tag "$REPO" '^[0-9]+\.[0-9]+(\.[0-9]+)?$')"
          SRC="$RUNNER_TEMP/dav1d"
          BUILD="$RUNNER_TEMP/dav1d-build"
          clone_tag "$REPO" "$TAG" "$SRC"
          meson_android "$SRC" "$BUILD" \
            -Denable_tools=false -Denable_tests=false
          test -s "$DEPS/lib/libdav1d.a"

      - name: Build SVT-AV1
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://gitlab.com/AOMediaCodec/SVT-AV1.git
          TAG="$(latest_tag "$REPO" '^v?[0-9]+(\.[0-9]+)+$')"
          SRC="$RUNNER_TEMP/SVT-AV1"
          clone_tag "$REPO" "$TAG" "$SRC"
          cmake_android "$SRC" "$RUNNER_TEMP/svt-av1-build" \
            -DBUILD_APPS=OFF -DBUILD_TESTING=OFF
          find "$DEPS/lib" -maxdepth 1 -name 'libSvtAv1Enc*.a' -print -quit | grep -q .

      - name: Build FreeType
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/freetype/freetype.git
          TAG="$(latest_tag "$REPO" '^VER-[0-9]+(-[0-9]+)+$')"
          SRC="$RUNNER_TEMP/freetype"
          clone_tag "$REPO" "$TAG" "$SRC"
          cmake_android "$SRC" "$RUNNER_TEMP/freetype-build" \
            -DFT_DISABLE_ZLIB=TRUE -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE
          test -s "$DEPS/lib/libfreetype.a"

      - name: Build FriBidi
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/fribidi/fribidi.git
          TAG="$(latest_tag "$REPO" '^[0-9]+\.[0-9]+(\.[0-9]+)?$')"
          SRC="$RUNNER_TEMP/fribidi"
          clone_tag "$REPO" "$TAG" "$SRC"
          meson_android "$SRC" "$RUNNER_TEMP/fribidi-build" \
            -Ddocs=false -Dtests=false -Dbin=false

      - name: Build HarfBuzz
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/harfbuzz/harfbuzz.git
          TAG="$(latest_tag "$REPO" '^[0-9]+\.[0-9]+(\.[0-9]+)?$')"
          SRC="$RUNNER_TEMP/harfbuzz"
          clone_tag "$REPO" "$TAG" "$SRC"
          meson_android "$SRC" "$RUNNER_TEMP/harfbuzz-build" \
            -Ddocs=disabled -Dtests=disabled -Dintrospection=disabled \
            -Dglib=disabled -Dcairo=disabled -Dicu=disabled \
            -Dfreetype=enabled -Dgraphite2=disabled

      - name: Build libwebp
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/webmproject/libwebp.git
          TAG="$(latest_tag "$REPO" '^v?[0-9]+\.[0-9]+\.[0-9]+$')"
          SRC="$RUNNER_TEMP/libwebp"
          clone_tag "$REPO" "$TAG" "$SRC"
          cmake_android "$SRC" "$RUNNER_TEMP/libwebp-build" \
            -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF \
            -DWEBP_BUILD_DWEBP=OFF -DWEBP_BUILD_GIF2WEBP=OFF \
            -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_LIBWEBPMUX=ON \
            -DWEBP_BUILD_EXTRAS=OFF

      - name: Build Expat
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/libexpat/libexpat.git
          TAG="$(latest_tag "$REPO" '^R_[0-9_]+$')"
          SRC="$RUNNER_TEMP/expat"
          clone_tag "$REPO" "$TAG" "$SRC"
          cmake_android "$SRC/expat" "$RUNNER_TEMP/expat-build" \
            -DEXPAT_SHARED_LIBS=OFF -DEXPAT_BUILD_TESTS=OFF \
            -DEXPAT_BUILD_EXAMPLES=OFF -DEXPAT_BUILD_TOOLS=OFF \
            -DEXPAT_BUILD_DOCS=OFF -DEXPAT_BUILD_PKGCONFIG=ON

      - name: Build Fontconfig
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://gitlab.freedesktop.org/fontconfig/fontconfig.git
          TAG="$(latest_tag "$REPO" '^[0-9]+(\.[0-9]+)+$')"
          SRC="$RUNNER_TEMP/fontconfig"
          clone_tag "$REPO" "$TAG" "$SRC"
          meson_android "$SRC" "$RUNNER_TEMP/fontconfig-build" \
            -Ddoc=disabled -Dtests=disabled -Dtools=disabled \
            -Dcache-build=disabled -Diconv=disabled -Dnls=disabled
          test -s "$DEPS/lib/libfontconfig.a"

      - name: Build OpenJPEG
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/uclouvain/openjpeg.git
          TAG="$(latest_tag "$REPO" '^v?[0-9]+\.[0-9]+\.[0-9]+$')"
          SRC="$RUNNER_TEMP/openjpeg"
          clone_tag "$REPO" "$TAG" "$SRC"
          cmake_android "$SRC" "$RUNNER_TEMP/openjpeg-build" \
            -DBUILD_CODEC=OFF -DBUILD_TESTING=OFF -DBUILD_DOC=OFF \
            -DBUILD_JPIP=OFF -DBUILD_MJ2=OFF -DWITH_TIFF=OFF \
            -DWITH_PNG=OFF -DWITH_OPENGL=OFF
          test -s "$DEPS/lib/libopenjp2.a"
          find "$DEPS/include" -name openjpeg.h -print -quit | grep -q .

      - name: Build LC3
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/google/liblc3.git
          TAG="$(latest_tag "$REPO" '^[0-9]+\.[0-9]+(\.[0-9]+)?$')"
          SRC="$RUNNER_TEMP/liblc3"
          clone_tag "$REPO" "$TAG" "$SRC"
          meson_android "$SRC" "$RUNNER_TEMP/liblc3-build" \
            -Dtools=false -Dpython=false
          find "$DEPS/lib" -maxdepth 1 -name '*lc3*.a' -print -quit | grep -q .

      - name: Build Theora
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/xiph/theora.git
          TAG="$(latest_tag "$REPO" '^[0-9]+\.[0-9]+(\.[0-9]+)?$')"
          SRC="$RUNNER_TEMP/libtheora-src"
          clone_tag "$REPO" "$TAG" "$SRC"
          cd "$SRC"

          # Preserve the config-script source that works for this build.
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub \
            -o ./config.sub
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess \
            -o ./config.guess
          chmod +x ./config.sub ./config.guess

          ./autogen.sh
          ./configure --build=x86_64-linux-gnu \
            --host=aarch64-linux-android --prefix="$DEPS" \
            --enable-static --disable-shared --disable-examples \
            --disable-spec --disable-oggtest --disable-vorbistest \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" CFLAGS="-O2 -fPIC"
          make -j"$BUILD_JOBS"
          make install
          test -s "$DEPS/lib/libtheora.a"

      - name: Build libass
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/libass/libass.git
          TAG="$(latest_tag "$REPO" '^0\.[0-9]+(\.[0-9]+)?$')"
          SRC="$RUNNER_TEMP/libass"
          clone_tag "$REPO" "$TAG" "$SRC"
          meson_android "$SRC" "$RUNNER_TEMP/libass-build" \
            -Dtest=disabled -Dcompare=disabled -Dprofile=disabled \
            -Dfuzz=disabled -Dcheckasm=disabled -Dfontconfig=enabled \
            -Dlibunibreak=disabled

      - name: Build libopenmpt
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://github.com/OpenMPT/openmpt.git
          TAG="$(latest_tag "$REPO" '^libopenmpt-[0-9]+\.[0-9]+(\.[0-9]+)?$')"
          SRC="$RUNNER_TEMP/libopenmpt"
          clone_tag "$REPO" "$TAG" "$SRC"
          cmake_android "$SRC" "$RUNNER_TEMP/libopenmpt-build" \
            -DOPENMPT_BUILD_TESTS=OFF -DOPENMPT_BUILD_EXAMPLES=OFF \
            -DOPENMPT_BUILD_SHARED=OFF

      - name: Configure and build FFmpeg
        shell: bash
        run: |
          source "$RUNNER_TEMP/build-common.sh"
          REPO=https://git.ffmpeg.org/ffmpeg.git
          TAG="$(latest_tag "$REPO" '^n[0-9]+(\.[0-9]+)+$')"
          SRC="$RUNNER_TEMP/ffmpeg"
          clone_tag "$REPO" "$TAG" "$SRC"
          cd "$SRC"

          ./configure \
            --prefix="$PREFIX" \
            --target-os=android \
            --arch=aarch64 \
            --enable-cross-compile \
            --sysroot="$SYSROOT" \
            --cc="$CC" --cxx="$CXX" \
            --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --pkg-config=pkg-config --pkg-config-flags=--static \
            --extra-cflags="-I$DEPS/include -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --extra-libs="-lm -ldl -lc++" \
            --enable-static --disable-shared --enable-pic \
            --enable-gpl \
            --enable-libx264 --enable-libx265 --enable-libvpx \
            --enable-libaom --enable-libdav1d --enable-libsvtav1 \
            --enable-libfreetype --enable-libfontconfig \
            --enable-libfribidi --enable-libharfbuzz --enable-libass \
            --enable-libwebp --enable-libopenjpeg --enable-liblc3 \
            --enable-libtheora --enable-libopus --enable-libvorbis \
            --enable-libmp3lame --enable-libtwolame --enable-libspeex \
            --enable-libsoxr --enable-libopenmpt

          make -j"$BUILD_JOBS"
          make install
          test -x "$PREFIX/bin/ffmpeg"
          "$PREFIX/bin/ffmpeg" -buildconf

      - name: Verify executable and package
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG="$PREFIX/bin/ffmpeg"
          test -x "$FFMPEG"

          echo "=== ELF architecture ==="
          "$TOOLCHAIN/bin/llvm-readelf" -h "$FFMPEG" | grep -E 'Class:|Machine:'

          echo "=== Dynamic dependencies ==="
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" || true

          PACKAGE="$RUNNER_TEMP/package"
          mkdir -p "$PACKAGE/bin" "$PACKAGE/lib"
          install -m 755 "$FFMPEG" "$PACKAGE/bin/ffmpeg"

          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" |
            sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' \
            > "$RUNNER_TEMP/needed-libs.txt"

          while IFS= read -r lib; do
            [ -n "$lib" ] || continue
            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so)
                continue ;;
              libc++_shared.so)
                src="$(find "$NDK" -name libc++_shared.so -type f -print -quit)"
                if [ -n "$src" ]; then cp "$src" "$PACKAGE/lib/"; fi
                ;;
              *)
                src="$(find "$DEPS/lib" "$SYSROOT/usr/lib/aarch64-linux-android" \
                  -name "$lib" -type f -print -quit)"
                if [ -n "$src" ]; then cp "$src" "$PACKAGE/lib/"; fi
                ;;
            esac
          done < "$RUNNER_TEMP/needed-libs.txt"

          cat > "$PACKAGE/run-ffmpeg.sh" <<'EOF'
          #!/system/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/bin/ffmpeg" "$@"
          EOF
          chmod +x "$PACKAGE/run-ffmpeg.sh"

          cd "$RUNNER_TEMP"
          tar -czf ffmpeg-android-arm64.tar.gz package
          sha256sum ffmpeg-android-arm64.tar.gz \
            > ffmpeg-android-arm64.tar.gz.sha256

      - name: Upload Android ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: |
            ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz
            ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
