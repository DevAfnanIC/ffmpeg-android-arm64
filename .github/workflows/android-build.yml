        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig" PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          get_latest_tag() {
            local repo_url="$1"
            local grep_pattern="${2:-^[vV]?[0-9]}"
            git ls-remote --tags --sort='v:refname' "$repo_url" | \
              awk -F/ '{print $3}' | \
              sed 's/\^{}//' | \
              grep -E "$grep_pattern" | \
              grep -vE 'rc|beta|alpha|dev|patch|pre' | \
              sort -Vu | \
              tail -n 1
          }

          FFMPEG_TAG=$(get_latest_tag "https://git.ffmpeg.org/ffmpeg.git" "^n[0-9.]+$")
          echo "Latest FFmpeg version: $FFMPEG_TAG"

          SRC="$RUNNER_TEMP/ffmpeg"
          git clone --depth 1 --branch "$FFMPEG_TAG" https://git.ffmpeg.org/ffmpeg.git "$SRC"
          cd "$SRC"

          ./configure \
            --prefix="$PREFIX" \
            --target-os=android \
            --arch=aarch64 \
            --enable-cross-compile \
            --sysroot="$SYSROOT" \
            --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --pkg-config=pkg-config --pkg-config-flags=--static \
            --extra-cflags="-I$DEPS/include -fPIC" \
            --extra-ldflags="-L$DEPS/lib" \
            --extra-libs="-lm" \
            --enable-static --disable-shared --enable-pic --enable-gpl \
            --enable-libx264 --enable-libx265 --enable-libvpx --enable-libaom --enable-libdav1d --enable-libsvtav1 \
            --enable-libfreetype --enable-libfontconfig --enable-libfribidi --enable-libharfbuzz --enable-libass \
            --enable-libwebp --enable-libopenjpeg --enable-liblc3 --enable-libtheora \
            --enable-libopus --enable-libvorbis --enable-libmp3lame --enable-libtwolame --enable-libspeex --enable-libsoxr

          make -j"$BUILD_JOBS"
          make install

      - name: Package Android ARM64 build
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/package"
          FFMPEG="$PREFIX/bin/ffmpeg"

          mkdir -p "$PACKAGE/bin" "$PACKAGE/lib"
          install -m 755 "$FFMPEG" "$PACKAGE/bin/ffmpeg"

          NEEDED="$RUNNER_TEMP/ffmpeg-needed.txt"
          "$TOOLCHAIN/bin/llvm-readelf" -d "$FFMPEG" \
            | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' \
            > "$NEEDED"

          while IFS= read -r lib; do
            [ -n "$lib" ] || continue
            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so) continue ;;
              libc++_shared.so)
                source_lib="$(find "$NDK" -name libc++_shared.so -type f -print -quit)"
                [ -n "$source_lib" ] && cp "$source_lib" "$PACKAGE/lib/"
                ;;
              *)
                source_lib="$(find "$DEPS/lib" "$SYSROOT/usr/lib/aarch64-linux-android" -name "$lib" -type f -print -quit)"
                [ -n "$source_lib" ] && cp "$source_lib" "$PACKAGE/lib/"
                ;;
            esac
          done < "$NEEDED"

          cat > "$PACKAGE/run-ffmpeg.sh" <<'EOF'
          #!/system/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/bin/ffmpeg" "$@"
          EOF
          chmod +x "$PACKAGE/run-ffmpeg.sh"

          cd "$RUNNER_TEMP"
          tar -czf ffmpeg-android-arm64.tar.gz package
          sha256sum ffmpeg-android-arm64.tar.gz > ffmpeg-android-arm64.tar.gz.sha256

      - name: Upload Android ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: |
            ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz
            ${{ runner.temp }}/ffmpeg-android-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
