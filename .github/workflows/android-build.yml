      - name: Build libopenmpt
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.8.9"
          SRC="$RUNNER_TEMP/libopenmpt"
          ARCHIVE="$RUNNER_TEMP/libopenmpt-${VERSION}.tar.gz"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$CC"
          export CXX="$CXX"
          export AR="$AR"
          export RANLIB="$RANLIB"
          export STRIP="$STRIP"

          export CFLAGS="-O2 -fPIC"
          export CXXFLAGS="-O2 -fPIC -std=c++17"
          export CPPFLAGS="-I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"

          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          echo "=== Check Android NDK zlib ==="

          find "$SYSROOT/usr/lib" -maxdepth 2 \
            \( -name 'libz.a' -o -name 'libz.so' \) -print

          echo "=== Check zlib header ==="
          test -s "$SYSROOT/usr/include/zlib.h" \
            && echo "Found Android zlib.h" \
            || echo "Android zlib.h not found"

          echo "=== Check compiler can find zlib ==="
          printf '#include <zlib.h>\nint main(void) { return zlibVersion() == 0; }\n' \
            > "$RUNNER_TEMP/check-android-zlib.c"

          "$CC" -c "$RUNNER_TEMP/check-android-zlib.c" \
            -o "$RUNNER_TEMP/check-android-zlib.o"

          echo "Android zlib header is usable by the cross-compiler."

          echo "=== Verify existing dependencies ==="
          test -s "$DEPS/lib/libogg.a"
          test -s "$DEPS/lib/libvorbis.a"
          test -s "$DEPS/lib/libvorbisfile.a" || {
            echo "ERROR: libvorbisfile.a is missing."
            echo "The current Vorbis step verifies libvorbisenc.a, not libvorbisfile.a."
            exit 1
          }

          echo "=== Expose Android NDK zlib to pkg-config ==="

          mkdir -p "$DEPS/lib/pkgconfig"

          cat > "$DEPS/lib/pkgconfig/zlib.pc" <<'ZLIB_PC'
          prefix=
          exec_prefix=${prefix}
          libdir=${prefix}
          includedir=${prefix}

          Name: zlib
          Description: Android NDK zlib
          Version: 1.3.1
          Libs: -lz
          Cflags:
          ZLIB_PC

          echo "=== Verify zlib pkg-config metadata ==="
          pkg-config --modversion zlib
          pkg-config --cflags zlib
          pkg-config --libs zlib

          echo "=== Download libopenmpt ${VERSION} ==="
          curl -fL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            "https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-${VERSION}+release.autotools.tar.gz" \
            -o "$ARCHIVE"

          echo "=== Extract source ==="
          rm -rf "$SRC"
          mkdir -p "$SRC"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$SRC"
          cd "$SRC"

          test -x ./configure
          echo "=== libopenmpt mpg123 configure options ==="
          ./configure --help | grep -i -C 3 'mpg123\|mo3' || true

          echo "=== mpg123 checks and option handling ==="
          grep -n -i -C 5 'mpg123\|mo3' configure.ac configure 2>/dev/null | head -200 || true
          echo "=== libopenmpt PortAudio configure options ==="
          ./configure --help | grep -i -C 3 'portaudio\|openmpt123\|examples' || true

          echo "=== PortAudio checks and option handling ==="
          grep -n -i -C 5 'portaudio\|openmpt123' configure.ac configure 2>/dev/null | head -180 || true
          echo "=== Configure libopenmpt for Android ARM64 ==="
          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host=aarch64-linux-android \
            --prefix="$DEPS" \
            --enable-static \
            --disable-shared \
            --disable-openmpt123 \
            --disable-examples \
            --without-mpg123 \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS"

          echo "=== Build libopenmpt ==="
          make -j"$BUILD_JOBS"

          echo "=== Install libopenmpt ==="
          make install

          echo "=== Verify installed artifacts ==="
          find "$DEPS/lib" -maxdepth 2 \
            \( -iname '*openmpt*.a' -o -iname '*openmpt*.pc' \) \
            -print

          test -s "$DEPS/lib/libopenmpt.a"
          test -s "$DEPS/lib/pkgconfig/libopenmpt.pc"
          test -s "$DEPS/include/libopenmpt/libopenmpt.h"

          echo "=== Verify pkg-config metadata ==="
          pkg-config --modversion libopenmpt
          pkg-config --cflags libopenmpt
          pkg-config --static --libs libopenmpt

          echo "libopenmpt build and installation completed."
          
      - name: Build Theora
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.1.1"
          SRC="$RUNNER_TEMP/libtheora-src"
          ARCHIVE="$RUNNER_TEMP/libtheora-${VERSION}.tar.bz2"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR

          echo "=== Verify Ogg dependency ==="
          test -s "$DEPS/lib/libogg.a"
          test -s "$DEPS/lib/pkgconfig/ogg.pc"

          echo "=== Download Theora ${VERSION} ==="
          curl -fL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            "https://downloads.xiph.org/releases/theora/libtheora-${VERSION}.tar.bz2" \
            -o "$ARCHIVE"

          echo "=== Verify Theora source checksum ==="
          echo "b6ae1ee2fa3d42ac489287d3ec34c5885730b1296f0801ae577a35193d3affbc  $ARCHIVE" \
            | sha256sum -c -

          rm -rf "$SRC"
          mkdir -p "$SRC"
          tar -xjf "$ARCHIVE" --strip-components=1 -C "$SRC"
          cd "$SRC"

          echo "=== Download GNU config helpers from GitHub mirror ==="

          curl -fL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub" \
            -o ./config.sub

          curl -fL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess" \
            -o ./config.guess

          test -s ./config.sub
          test -s ./config.guess

          head -n 1 ./config.sub | grep -q '^#!'
          head -n 1 ./config.guess | grep -q '^#!'

          chmod +x ./config.sub ./config.guess

          echo "=== Verify Android target recognition ==="
          ./config.sub aarch64-linux-android

          echo "=== Configure Theora ==="
          ./configure \
            --build=x86_64-linux-gnu \
            --host=aarch64-linux-android \
            --prefix="$DEPS" \
            --enable-static \
            --disable-shared \
            --disable-examples \
            --disable-spec \
            --disable-oggtest \
            --disable-vorbistest \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="-O2 -fPIC"

          echo "=== Compile Theora ==="
          make -j"$BUILD_JOBS"

          echo "=== Install Theora ==="
          make install

          echo "=== Verify Theora static libraries ==="
          find "$DEPS/lib" -maxdepth 2 -type f -name '*theora*.a' -print

          test -s "$DEPS/lib/libtheoradec.a"
          test -s "$DEPS/lib/libtheoraenc.a"

          echo "=== Verify Theora pkg-config files ==="
          find "$DEPS/lib/pkgconfig" -maxdepth 1 -iname '*theora*.pc' -print

          echo "Theora built successfully"
          
