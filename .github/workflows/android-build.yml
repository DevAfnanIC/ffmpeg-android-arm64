      - name: Build GSM
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          git clone --depth 1 https://github.com/timothytylee/libgsm.git gsm-src
          cd gsm-src

          mkdir -p build-objects "$DEPS/lib" "$DEPS/include"

          # Compile only library sources; do not build host utilities.
          SOURCES=(
            add
            code
            debug
            decode
            long_term
            lpc
            preprocess
            rpe
            gsm_destroy
            gsm_decode
            gsm_encode
            gsm_explode
            gsm_implode
            gsm_create
            gsm_print
            gsm_option
            short_term
            table
          )

          OBJECTS=()

          for src in "${SOURCES[@]}"; do
            echo "Compiling $src.c"
            "$CC" \
              -c \
              -O2 \
              -DNeedFunctionPrototypes \
              -DSASR \
              -DWAV49 \
              -Wno-comment \
              -I"$PWD/inc" \
              "src/$src.c" \
              -o "build-objects/$src.o"

            OBJECTS+=("build-objects/$src.o")
          done

          # Create the Android ARM64 static archive.
          "$AR" rcs "$DEPS/lib/libgsm.a" "${OBJECTS[@]}"
          "$RANLIB" "$DEPS/lib/libgsm.a"

          install -m 644 inc/gsm.h "$DEPS/include/gsm.h"

          test -s "$DEPS/lib/libgsm.a"
          "$AR" t "$DEPS/lib/libgsm.a"

          echo "GSM static library built successfully"

